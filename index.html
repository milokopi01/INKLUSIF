const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbxZhcLjRxceUTVzVoN2jODtdVw6rJm-IPTfdbQD9hAr1SoYTf3WlA--8jtuM7ZLYYCtsQ/exec';

const SHEET_UPLOAD = 'Fail_Upload';
const SHEET_TEACHERS = 'Guru_PPKI';
const SHEET_STUDENTS = 'Murid_PPPI';
const SHEET_ORGCHART = 'Carta_Organisasi';

async function apiCall(action, payload = {}) {
  const url = localStorage.getItem('jpks_api_url') || DEFAULT_API_URL;
  if (!url) return { ok: false, error: 'URL API belum ditetapkan. Buka Tetapan untuk masukkan URL Web App.' };
  try {
    const res = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload }),
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { return { ok: false, error: 'Respon API tidak sah: ' + text.slice(0, 200) }; }
    return data;
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

/* Proxy AI Groq (auto-rotasi API key dilakukan di code.gs) */
async function aiCall(prompt, system) {
  const res = await apiCall('ai', { prompt, system: system || '' });
  if (!res.ok) throw new Error(res.error || 'Panggilan AI gagal.');
  return res.data;
}

/* Muat naik fail Base64 ke Google Drive melalui code.gs */
async function uploadFile(base64Data, fileName, tajukKecilId) {
  return apiCall('upload', { base64Data, fileName, tajukKecilId });
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(fr.result);
    fr.onerror = reject;
    fr.readAsDataURL(file);
  });
}

/* ============================================================

function Icon({ name, size = 18, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const svg = window.lucide.createElement
        ? window.lucide.createElement(window.lucide.icons[toPascalCase(name)])
        : null;
      if (svg) { svg.setAttribute('width', size); svg.setAttribute('height', size); ref.current.appendChild(svg); }
      else ref.current.setAttribute('data-lucide', name);
    }
    if (ref.current && window.lucide && window.lucide.createIcons) window.lucide.createIcons({ attrs: { width: size, height: size }, nameAttr: 'data-lucide' });
  }, [name, size]);
  return <span ref={ref} data-lucide={name} className={'inline-flex items-center ' + className} style={{ width: size, height: size }} />;
}
function toPascalCase(s) { return s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(''); }

function Toast({ toast, onClose }) {

/* ============================================================

function generatePDF(element, filename, onToast, toastMsg) {
  if (!window.html2pdf) { if (onToast) onToast({ type: 'error', msg: 'Pustaka PDF tidak dimuatkan.' }); return; }
  const opt = { margin: 10, filename: filename, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, logging: false }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
  window.html2pdf().set(opt).from(element).save();
  if (onToast) onToast({ type: 'success', msg: toastMsg || 'PDF dijana.' });
}
function formatDate(d) {
  if (!d) return '________________';
  try { return new Date(d).toLocaleDateString('ms-MY', { day: '2-digit', month: 'long', year: 'numeric' }); } catch { return d; }
}

/* ============================================================
   UNIVERSAL INLINE FILE UPLOADER
   ============================================================ */
function FileUploader({ sectionId, onToast }) {
  const [files, setFiles] = useState([]);
  const [dragOver, setDragOver] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const inputRef = useRef(null);

  function handleFiles(fileList) {
    const arr = Array.from(fileList);
    let loaded = 0;
    arr.forEach(file => {
      if (file.size > 10 * 1024 * 1024) { onToast({ type: 'error', msg: file.name + ' melebihi 10MB.' }); return; }
      const reader = new FileReader();
      reader.onload = ev => {
        setFiles(prev => [...prev, { id: 'f' + Date.now() + Math.random().toString(36).slice(2), name: file.name, type: file.type, size: file.size, base64: ev.target.result, isImage: file.type.startsWith('image/') }]);
        loaded++;
        if (loaded === arr.length) onToast({ type: 'success', msg: arr.length + ' fail dimuat naik sebagai Base64.' });
      };
      reader.readAsDataURL(file);
    });
  }
  function deleteFile(id) { setFiles(files.filter(f => f.id !== id)); onToast({ type: 'success', msg: 'Fail dipadam.' }); }
  function openFile(file) { const w = window.open(file.base64, '_blank'); if (!w) onToast({ type: 'error', msg: 'Sekatan pop-up aktif. Sila benarkan pop-up.' }); }
  function getFileMeta(file) {
    const n = file.name.toLowerCase();
    if (file.isImage) return { icon: 'image', color: 'text-blue-600', bg: 'bg-blue-100', label: 'IMG' };
    if (n.endsWith('.pdf')) return { icon: 'file-text', color: 'text-rose-600', bg: 'bg-rose-100', label: 'PDF' };
    if (n.endsWith('.doc') || n.endsWith('.docx')) return { icon: 'file-text', color: 'text-blue-600', bg: 'bg-blue-100', label: 'DOC' };
    if (n.endsWith('.xls') || n.endsWith('.xlsx')) return { icon: 'file-spreadsheet', color: 'text-emerald-600', bg: 'bg-emerald-100', label: 'XLS' };
    if (n.endsWith('.ppt') || n.endsWith('.pptx')) return { icon: 'presentation', color: 'text-amber-600', bg: 'bg-amber-100', label: 'PPT' };
    return { icon: 'file', color: 'text-slate-600', bg: 'bg-slate-100', label: 'FILE' };
  }
  function fmtSize(b) { if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(1) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; }

  return (
    <div className="mt-4 border-t border-slate-100 pt-4">
      <p className="text-sm font-semibold text-slate-600 mb-2 flex items-center gap-1.5"><Icon name="paperclip" size={15} /> Fail Lampiran</p>
      <div className={`border-2 border-dashed rounded-xl p-4 text-center cursor-pointer transition-all ${dragOver ? 'border-blue-500 bg-blue-50' : 'border-slate-300 hover:border-blue-400 hover:bg-slate-50'}`} onClick={() => inputRef.current?.click()} onDragOver={e => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)} onDrop={e => { e.preventDefault(); setDragOver(false); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); }}>
        <input ref={inputRef} type="file" multiple className="hidden" onChange={e => { if (e.target.files.length) handleFiles(e.target.files); e.target.value = ''; }} />
        <Icon name="upload-cloud" size={28} className="mx-auto mb-2 text-slate-400" />
        <p className="text-sm text-slate-500 font-medium">Seret fail ke sini atau klik untuk muat naik</p>
        <p className="text-xs text-slate-400 mt-1">Gambar, PDF, Word, Excel, PowerPoint (max 10MB)</p>
      </div>
      {files.length > 0 && (
        <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mt-4">
          {files.map(f => {
            const fm = getFileMeta(f);
            return (
              <div key={f.id} className="border border-slate-200 rounded-xl p-3 hover:shadow-md transition-shadow">
                {f.isImage ? (
                  <div className="cursor-pointer" onClick={() => setLightbox(f)}><img src={f.base64} alt={f.name} className="w-full h-24 object-cover rounded-lg mb-2" /></div>
                ) : (
                  <div className={`w-full h-24 ${fm.bg} rounded-lg mb-2 flex flex-col items-center justify-center`}><Icon name={fm.icon} size={28} className={fm.color} /><span className={`text-xs font-bold mt-1 ${fm.color}`}>{fm.label}</span></div>
                )}
                <p className="text-xs font-medium text-slate-700 truncate" title={f.name}>{f.name}</p>
                <p className="text-xs text-slate-400">{fmtSize(f.size)}</p>
                <div className="flex gap-1 mt-2">
                  <button onClick={() => openFile(f)} className="flex-1 text-xs py-1 rounded-lg bg-blue-50 text-blue-600 hover:bg-blue-100 font-medium flex items-center justify-center gap-1"><Icon name="external-link" size={12} /> Buka</button>
                  <button onClick={() => deleteFile(f.id)} className="flex-1 text-xs py-1 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 font-medium flex items-center justify-center gap-1"><Icon name="trash-2" size={12} /> Padam</button>
                </div>
              </div>
            );
          })}
        </div>
      )}
      {lightbox && (
        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm" onClick={() => setLightbox(null)}>
          <div className="relative max-w-4xl max-h-[90vh]" onClick={e => e.stopPropagation()}>
            <button onClick={() => setLightbox(null)} className="absolute -top-3 -right-3 w-8 h-8 bg-white rounded-full shadow-lg flex items-center justify-center text-slate-600 hover:text-slate-900 z-10"><Icon name="x" size={18} /></button>
            <img src={lightbox.base64} alt={lightbox.name} className="max-w-full max-h-[85vh] rounded-xl shadow-2xl" />
            <p className="text-white text-sm text-center mt-2">{lightbox.name}</p>
          </div>
        </div>
      )}
    </div>
  );
}

      setTeachers([...teachers, { ...t, id: 't' + Date.now() }]);
      onToast({ type: 'success', msg: 'Profil guru baharu ditambah.' });

    setEditing(null);

    setTeachers(teachers.filter(t => t.id !== id));

}

const SSKI_IS_ITEMS = [

    { code: 'D2.4', text: 'Murid boleh mendengar dengan baik dan bertindak balas secara positif terhadap panggilan nama diri.' },

  ]},
  { domain: 'Sosioemosi & Interaksi', icon: 'heart', items: [
    { code: 'D3.1', text: 'Murid menunjukkan emosi yang stabil dan tidak mudah menangis atau marah tanpa sebab yang munasabah.' },
    { code: 'D3.2', text: 'Murid boleh bertoleransi, berkongsi alatan, dan bekerjasama dalam aktiviti berkumpulan.' },
    { code: 'D3.3', text: 'Murid menunjukkan rasa hormat terhadap guru dan rakan dengan memberi salam atau ucapan terima kasih.' },

    { code: 'D3.5', text: 'Murid bertindak balas secara mesra dan berupaya membentuk interaksi sosial asas dengan rakan arus perdana.' },
  ]},
  { domain: 'Pengurusan Tingkah Laku', icon: 'shield-check', items: [
    { code: 'D4.1', text: 'Murid tidak menunjukkan tingkah laku agresif yang membahayakan diri sendiri atau rakan lain.' },
    { code: 'D4.2', text: 'Murid boleh mengawal emosi/tantrum sekiranya berlaku perubahan rutin atau kegagalan tugasan.' },
    { code: 'D4.3', text: 'Murid mematuhi peraturan bilik darjah biasa (duduk di kerusi, beratur, menjaga ketenteraman).' },
    { code: 'D4.4', text: 'Murid boleh mengurus kebersihan diri dan ke tandas secara berdikari tanpa perlu dipimpin sepanjang masa.' },
    { code: 'D4.5', text: 'Murid bertindak balas secara patuh terhadap isyarat arahan menghentikan tingkah laku yang kurang sesuai.' },
  ]},
  { domain: 'Psikomotor & Mobiliti', icon: 'activity', items: [
    { code: 'D5.1', text: 'Murid mempunyai koordinasi motor halus yang baik untuk memegang pensel, menulis, dan menggunting.' },
    { code: 'D5.2', text: 'Murid mempunyai kekuatan fizikal untuk membawa beg sekolah dan alatan pembelajaran sendiri.' },
    { code: 'D5.3', text: 'Murid mampu bergerak (berjalan/mobiliti) dari kelas PPKI ke kelas arus perdana secara berdikari/selamat.' },
    { code: 'D5.4', text: 'Murid berupaya menyertai aktiviti psikomotor kasar (berlari, melompat, menangkap bola) di kelas Pendidikan Jasmani.' },
    { code: 'D5.5', text: 'Murid menunjukkan koordinasi fizikal dan kestabilan tubuh yang baik semasa menjalankan aktiviti fizikal.' },
  ]},
];

function SaringanSSKI({ onToast, students }) {
  const [selectedStudent, setSelectedStudent] = useState('');
  const [responses, setResponses] = useState({});
  const [showBorang, setShowBorang] = useState(null);
  const borangRef = useRef(null);
  const [borangData, setBorangData] = useState({ namaIbuBapa: '', kadPengenalan: '', alamat: '', tarikh: '', tandaTangan: '' });
  const [rpiItems, setRpiItems] = useState([]);

  const allItems = useMemo(() => SSKI_IS_ITEMS.flatMap(d => d.items.map(i => ({ ...i, domain: d.domain }))), []);
  const yaCount = useMemo(() => allItems.filter(i => responses[i.code] === 'YA').length, [responses, allItems]);
  const answeredCount = useMemo(() => allItems.filter(i => responses[i.code]).length, [responses, allItems]);
  const percentage = useMemo(() => Math.round((yaCount / 25) * 100), [yaCount]);
  const isComplete = answeredCount === 25;

  const qualification = useMemo(() => {
    if (!isComplete) return null;
    if (percentage >= 70) return { label: 'Layak Inklusif Akademik', color: 'green', desc: 'Murid layak mengikuti program inklusif separa untuk subjek akademik di kelas arus perdana.', borang: 'akuan' };
    if (percentage >= 50) return { label: 'Layak Inklusif Bukan Akademik', color: 'amber', desc: 'Murid layak inklusif separa untuk subjek bukan akademik (Pendidikan Seni, Jasmani, Muzik) dengan sokongan rakan pendamping (Buddy System) atau PPM.', borang: null };
    return { label: 'Belum Bersedia (Kekal di PPKI)', color: 'rose', desc: 'Murid belum bersedia untuk inklusif. Kekal di program PPKI untuk intervensen lanjutan.', borang: 'rpi' };
  }, [percentage, isComplete]);

  function setResponse(code, val) {
    setResponses(prev => ({ ...prev, [code]: val }));
    setShowBorang(null);
  }
  function resetSaringan() {
    setResponses({});
    setShowBorang(null);
    setBorangData({ namaIbuBapa: '', kadPengenalan: '', alamat: '', tarikh: '', tandaTangan: '' });
    setRpiItems([]);
  }
  function generateBorang() {
    if (qualification?.borang === 'rpi') {
      const tidaks = allItems.filter(i => responses[i.code] === 'TIDAK');
      setRpiItems(tidaks);
    }
    setShowBorang(qualification.borang);
  }
  function saveBorangPDF() {
    const studentName = students.find(s => s.id === selectedStudent)?.nama || 'Murid';
    if (showBorang === 'akuan') {
      generatePDF(borangRef.current, `Borang_Akuan_Persetujuan_Ibu_Bapa_${studentName.replace(/\s/g,'_')}.pdf`, onToast, 'PDF Borang Akuan Persetujuan Ibu Bapa dijana.');
    } else {
      generatePDF(borangRef.current, `Borang_RPI_${studentName.replace(/\s/g,'_')}.pdf`, onToast, 'PDF Borang Cadangan Pelan Intervensi (RPI) dijana.');
    }
  }
  const student = students.find(s => s.id === selectedStudent);

  return (
    <Card className="p-6">
      <SectionTitle icon="clipboard-check" title="Instrumen Saringan Kesediaan Inklusif Separa (SSKI-IS)" desc="25 item rasmi Buku Panduan PPKI KPM — 5 Domain Utama" />
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <Field label="Pilih Murid untuk Saringan">
          <Select value={selectedStudent} onChange={e => { setSelectedStudent(e.target.value); resetSaringan(); }}>
            <option value="">-- Pilih Murid --</option>
            {students.map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}
          </Select>
        </Field>
        <div className="md:col-span-2 flex items-end gap-3">
          {student && <div className="text-sm text-slate-600 bg-slate-50 rounded-xl px-4 py-2 flex-1"><span className="font-semibold">Murid:</span> {student.nama} | <span className="font-semibold">Kelas:</span> {student.kelas} | <span className="font-semibold">Diagnosis:</span> {student.diagnosis}</div>}
        </div>
      </div>

      {selectedStudent && (
        <>
          {/* Progress Bar */}
          <div className="mb-6">
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-sm font-semibold text-slate-600">Kemajuan Saringan: {answeredCount}/25 item</span>
              {isComplete && <span className="text-sm font-bold text-blue-700">Selesai!</span>}
            </div>
            <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
              <div className="h-full bg-blue-600 rounded-full transition-all duration-300" style={{ width: `${(answeredCount / 25) * 100}%` }} />
            </div>
          </div>

          {/* 5 Domain Checklist */}
          <div className="space-y-5">
            {SSKI_IS_ITEMS.map((dom, di) => (
              <div key={di} className="border border-slate-200 rounded-2xl overflow-hidden">
                <div className="bg-slate-50 px-4 py-3 flex items-center gap-2 border-b border-slate-200">
                  <Icon name={dom.icon} size={18} className="text-blue-600" />
                  <h4 className="font-bold text-slate-800 text-sm">{dom.domain}</h4>
                  <span className="ml-auto text-xs text-slate-400">5 item</span>
                </div>
                <div className="divide-y divide-slate-100">
                  {dom.items.map((item, ii) => {
                    const val = responses[item.code];
                    return (
                      <div key={ii} className="flex items-center gap-3 px-4 py-3 hover:bg-slate-50/50 transition-colors">
                        <div className="flex-shrink-0 w-12">
                          <Badge color="slate">{item.code}</Badge>
                        </div>
                        <p className="flex-1 text-sm text-slate-700">{item.text}</p>
                        <div className="flex gap-1.5 flex-shrink-0">
                          <button onClick={() => setResponse(item.code, 'YA')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border-b-2 active:border-b-0 active:translate-y-0.5 ${val === 'YA' ? 'bg-emerald-600 text-white border-emerald-800' : 'bg-white text-slate-500 border-slate-300 hover:bg-emerald-50'}`}>YA</button>
                          <button onClick={() => setResponse(item.code, 'TIDAK')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border-b-2 active:border-b-0 active:translate-y-0.5 ${val === 'TIDAK' ? 'bg-rose-600 text-white border-rose-800' : 'bg-white text-slate-500 border-slate-300 hover:bg-rose-50'}`}>TIDAK</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {/* Hasil Saringan & Kelayakan */}
          {isComplete && (
            <div className="mt-6 slide-up">
              <div className={`rounded-2xl border-2 p-5 ${qualification.color === 'green' ? 'border-emerald-200 bg-emerald-50' : qualification.color === 'amber' ? 'border-amber-200 bg-amber-50' : 'border-rose-200 bg-rose-50'}`}>
                <div className="flex items-center justify-between flex-wrap gap-3">
                  <div>
                    <p className="text-sm font-semibold text-slate-600 mb-1">Keputusan Saringan SSKI-IS</p>
                    <div className="flex items-center gap-3">
                      <span className={`text-3xl font-extrabold ${qualification.color === 'green' ? 'text-emerald-700' : qualification.color === 'amber' ? 'text-amber-700' : 'text-rose-700'}`}>{percentage}%</span>
                      <span className="text-sm text-slate-500">({yaCount} YA / {25 - yaCount} TIDAK)</span>
                    </div>
                  </div>
                  <div className="text-right">
                    <Badge color={qualification.color}>{qualification.label}</Badge>
                    <p className="text-xs text-slate-500 mt-1 max-w-xs">{qualification.desc}</p>
                  </div>
                </div>
                <div className="flex gap-2 mt-4 flex-wrap">
                  <Btn variant="white" onClick={resetSaringan}><Icon name="rotate-ccw" size={16} /> Reset Saringan</Btn>
                  {qualification.borang && (
                    <Btn variant="green" onClick={generateBorang}>
                      <Icon name="file-text" size={16} />
                      {qualification.borang === 'akuan' ? 'Buka Borang Akuan Persetujuan Ibu Bapa' : 'Buka Borang Cadangan RPI'}
                    </Btn>
                  )}

function TabProfilMBK({ onToast }) {
  const [students, setStudents] = useState(DEFAULT_STUDENTS);
  const [editing, setEditing] = useState(null);
  const [aiInput, setAiInput] = useState('');
  const [aiResult, setAiResult] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);

  function saveStudent(s) {
    if (s.id) {
      setStudents(students.map(x => x.id === s.id ? s : x));
      onToast({ type: 'success', msg: 'Profil murid dikemas kini.' });
    } else {
      setStudents([...students, { ...s, id: 's' + Date.now() }]);
      onToast({ type: 'success', msg: 'Profil murid baharu ditambah.' });
    }
    setEditing(null);
  }
  function deleteStudent(id) {
    setStudents(students.filter(s => s.id !== id));
    onToast({ type: 'success', msg: 'Profil murid dipadam.' });
  }
  function getMarkahColor(m) {
    if (m >= 80) return 'green';
    if (m >= 60) return 'blue';
    if (m >= 40) return 'amber';
    return 'rose';
  }
  function runAI() {
    if (!aiInput.trim()) { onToast({ type: 'error', msg: 'Sila masukkan soalan atau data murid.' }); return; }
    setAiLoading(true);
    setTimeout(() => {
      const input = aiInput.toLowerCase();
      let result = '';
      if (input.includes('amirul')) {
        result = `Analisis Minda AI untuk Muhammad Amirul bin Roslan:\n\n• Diagnosis: Slow Learner (Markah Saringan: 64)\n• Status: Layak Inklusif Separa (Bukan Akademik)\n\nCadangan Intervensi:\n1. Penggunaan bahan bantu mengajar visual dan kinestetik\n2. Masa tugasan dipendekkan dengan rehat lebih kerap\n3. Penempatan di barisan hadapan untuk tumpuan optimum\n4. Bimbingan sosial untuk kemahiran interaksi rakan\n5. Penilaian formatif berterusan setiap 2 minggu`;
      } else if (input.includes('wei han') || input.includes('chong')) {
        result = `Analisis Minda AI untuk Chong Wei Han:\n\n• Diagnosis: Masalah Pendengaran (Markah Saringan: 76)\n• Status: Layak Inklusif Separa (Akademik)\n\nCadangan Intervensi:\n1. Penggunaan FM System / gelung pendengaran dalam kelas\n2. Arahan visual dan penambahan teks pada papan tulis\n3. Tempat duduk menghadap guru untuk pembacaan bibir\n4. Rakan pendamping (peer tutoring) untuk nota tambahan\n5. Penilaian lisan digantikan dengan bertulis/visual`;
      } else if (input.includes('farah')) {
        result = `Analisis Minda AI untuk Farah Shahidah binti Ahmad:\n\n• Diagnosis: Autisme Ringan (Markah Saringan: 84)\n• Status: Layak Inklusif Separa (Akademik)\n\nCadangan Intervensi:\n1. Struktur rutin harian yang jelas dan boleh ramal\n2. Visual schedule untuk pengurusan transisi aktiviti\n3. Ruang tenang (quiet corner) jika berlaku sensory overload\n4. Sosial cerita (social stories) untuk interaksi rakan\n5. Pengukuhan positif untuk pencapaian akademik`;
      } else {
        result = `Analisis Minda AI:\n\nBerdasarkan input yang diberikan, sistem mengesyorkan:\n1. Jalankan saringan PMD untuk pengesahan diagnosis\n2. Tetapkan jenis inklusif (separa/penuh) berdasarkan markah saringan\n3. Lampirkan guru pendamping mengikut keperluan\n4. Sediakan pelan intervensen individu (IEP) untuk setiap murid\n5. Pemantauan dan penilaian berkala oleh JPKS\n\nTip: Taip nama murid (Amirul, Wei Han, atau Farah) untuk analisis spesifik.`;
      }
      setAiResult(result);
      setAiLoading(false);
    }, 1200);
  }

  return (
    <div className="space-y-6 fade-in">
      {/* Sub-Tajuk 1: Pangkalan Data Murid Inklusif */}
      <Card className="p-6">
        <div className="flex items-center justify-between mb-4">
          <SectionTitle icon="database" title="Pangkalan Data Murid Inklusif" desc="Profil murid PPKI dengan saringan dan status penempatan" />
          <Btn variant="blue" onClick={() => setEditing({ id: '', nama: '', mykid: '', oku: '', diagnosis: '', kelas: '', jenis: 'Inklusif Separa', guru_mentor: '', markah_saringan: 0, status: '' })}><Icon name="plus" size={16} /> Tambah Murid</Btn>
        </div>
        <div className="space-y-4">
          {students.map(s => (
            <div key={s.id} className="border border-slate-200 rounded-2xl p-4 hover:shadow-md transition-shadow">
              <div className="flex flex-wrap items-start justify-between gap-3">

                  <div className="flex items-center gap-2 mb-2">
                    <h4 className="font-bold text-slate-900">{s.nama}</h4>
                    <Badge color={getMarkahColor(s.markah_saringan)}>Saringan: {s.markah_saringan}</Badge>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-1 text-sm">
                    <p className="text-slate-500">MyKid: <span className="font-medium text-slate-700">{s.mykid}</span></p>
                    <p className="text-slate-500">OKU: <span className="font-medium text-slate-700">{s.oku}</span></p>
                    <p className="text-slate-500">Diagnosis: <span className="font-medium text-slate-700">{s.diagnosis}</span></p>

                  </div>
                  <div className="mt-2"><Badge color={s.status.includes('Akademik') ? 'green' : 'amber'}>{s.status}</Badge></div>

                <div className="flex gap-2">
                  <button onClick={() => setEditing({...s})} className="p-2 rounded-lg hover:bg-blue-50 text-blue-600"><Icon name="pencil" size={16} /></button>

                </div>
              </div>
            </div>
          ))}
        </div>
        <FileUploader sectionId="profil_pangkalan_murid" onToast={onToast} />
      </Card>

      {/* Minda AI */}
      <Card className="p-6">
        <SectionTitle icon="brain" title="Minda AI — Analisis Intervensi Inklusif" desc="Masukkan nama murid untuk cadangan intervensen AI" />
        <div className="space-y-4">
          <div className="flex gap-2">
            <Input value={aiInput} onChange={e => setAiInput(e.target.value)} placeholder="Cth: Analisis Amirul / Cadangan untuk Wei Han" onKeyDown={e => e.key === 'Enter' && runAI()} />
            <Btn variant="blue" onClick={runAI} disabled={aiLoading}><Icon name="sparkles" size={16} /> {aiLoading ? 'Menganalisis...' : 'Analisis'}</Btn>
          </div>
          {aiLoading && <Loading msg="Minda AI sedang menganalisis..." />}
          {aiResult && !aiLoading && (
            <div className="bg-blue-50/50 border border-blue-100 rounded-xl p-5 slide-up">
              <pre className="text-sm text-slate-700 whitespace-pre-wrap font-sans leading-relaxed">{aiResult}</pre>
            </div>
          )}
        </div>
        <FileUploader sectionId="profil_minda_ai" onToast={onToast} />
      </Card>

      {/* Sub-Tajuk: Instrumen Saringan SSKI-IS */}
      <SaringanSSKI onToast={onToast} students={students} />

      {/* Modal Edit Murid */}
      <Modal open={!!editing} onClose={() => setEditing(null)} title={editing?.id ? 'Edit Profil Murid' : 'Tambah Murid Inklusif'} wide>

          <div className="space-y-4">

  const swotRef = useRef(null);

  function savePpt(p) {
    if (p.id) { setPpt(ppt.map(x => x.id === p.id ? p : x)); onToast({ type: 'success', msg: 'Keputusan PPT dikemas kini.' }); }
    else { setPpt([...ppt, { ...p, id: 'p' + Date.now() }]); onToast({ type: 'success', msg: 'Rekod PPT ditambah.' }); }
    setEditingPpt(null);
  }
  function deletePpt(id) { setPpt(ppt.filter(p => p.id !== id)); onToast({ type: 'success', msg: 'Rekod PPT dipadam.' }); }
  function savePras(p) {
    if (p.id) { setPrasarana(prasarana.map(x => x.id === p.id ? p : x)); onToast({ type: 'success', msg: 'Inventori dikemas kini.' }); }
    else { setPrasarana([...prasarana, { ...p, id: 'pr' + Date.now() }]); onToast({ type: 'success', msg: 'Item prasarana ditambah.' }); }
    setEditPras(null);
  }
  function deletePras(id) { setPrasarana(prasarana.filter(p => p.id !== id)); onToast({ type: 'success', msg: 'Item prasarana dipadam.' }); }
  function getGrade(m) { if (m >= 80) return 'A'; if (m >= 70) return 'B'; if (m >= 60) return 'C'; if (m >= 50) return 'D'; return 'E'; }
  function getGradeColor(g) { if (g === 'A') return 'green'; if (g === 'B') return 'blue'; if (g === 'C') return 'amber'; return 'rose'; }

  return (
    <div className="space-y-6 fade-in">
      {/* Sub-Tajuk 1: Rekod Prestasi PPT 2026 */}
      <Card className="p-6">
        <div className="flex items-center justify-between mb-4">
          <SectionTitle icon="bar-chart-3" title="Rekod Prestasi PPT 2026" desc="Keputusan peperiksaan subjek teras murid inklusif" />
          <Btn variant="blue" onClick={() => setEditingPpt({ id: '', nama: '', kelas: '', bm: 0, bi: 0, matematik: 0, sains: 0 })}><Icon name="plus" size={16} /> Tambah Rekod</Btn>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-200 text-left text-slate-500">
                <th className="py-3 px-4 font-semibold">Nama</th>
                <th className="py-3 px-4 font-semibold">Kelas</th>
                <th className="py-3 px-4 font-semibold text-center">BM</th>
                <th className="py-3 px-4 font-semibold text-center">BI</th>
                <th className="py-3 px-4 font-semibold text-center">Matematik</th>
                <th className="py-3 px-4 font-semibold text-center">Sains</th>
                <th className="py-3 px-4 font-semibold text-center">Gred</th>
                <th className="py-3 px-4 font-semibold text-right">Tindakan</th>
              </tr>
            </thead>
            <tbody>
              {ppt.map(p => {
                const avg = Math.round((p.bm + p.bi + p.matematik + p.sains) / 4);
                const grade = getGrade(avg);
                return (
                  <tr key={p.id} className="border-b border-slate-100 hover:bg-slate-50/50">
                    <td className="py-3 px-4 font-semibold text-slate-900">{p.nama}</td>
                    <td className="py-3 px-4 text-slate-600">{p.kelas}</td>
                    <td className="py-3 px-4 text-center font-medium">{p.bm}</td>
                    <td className="py-3 px-4 text-center font-medium">{p.bi}</td>
                    <td className="py-3 px-4 text-center font-medium">{p.matematik}</td>
                    <td className="py-3 px-4 text-center font-medium">{p.sains}</td>
                    <td className="py-3 px-4 text-center"><Badge color={getGradeColor(grade)}>{grade} ({avg})</Badge></td>
                    <td className="py-3 px-4">
                      <div className="flex gap-2 justify-end">
                        <button onClick={() => setEditingPpt({...p})} className="p-2 rounded-lg hover:bg-blue-50 text-blue-600"><Icon name="pencil" size={16} /></button>
                        <button onClick={() => deletePpt(p.id)} className="p-2 rounded-lg hover:bg-rose-50 text-rose-600"><Icon name="trash-2" size={16} /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
        <FileUploader sectionId="prestasi_rekod_ppt" onToast={onToast} />
      </Card>

      {/* Sub-Tajuk 2: Inventori Prasarana OKU */}
      <Card className="p-6">
        <div className="flex items-center justify-between mb-4">
          <SectionTitle icon="accessibility" title="Inventori Prasarana OKU" desc="Checklist kemudahan fizikal mesra OKU" />
          <Btn variant="blue" onClick={() => setEditPras({ id: '', item: '', lokasi: '', status: 'Ada', catatan: '' })}><Icon name="plus" size={16} /> Tambah Item</Btn>
        </div>
        <div className="space-y-3">
          {prasarana.map(p => (
            <div key={p.id} className="flex items-center justify-between gap-3 border border-slate-200 rounded-xl p-4 hover:shadow-sm transition-shadow">
              <div className="flex items-center gap-3 flex-1">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${p.status === 'Ada' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}`}>
                  <Icon name={p.status === 'Ada' ? 'check' : 'x'} size={20} />
                </div>
                <div>
                  <p className="font-semibold text-slate-900">{p.item}</p>
                  <p className="text-xs text-slate-500">{p.lokasi} — {p.catatan}</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <Badge color={p.status === 'Ada' ? 'green' : 'rose'}>{p.status}</Badge>
                <button onClick={() => setEditPras({...p})} className="p-2 rounded-lg hover:bg-blue-50 text-blue-600"><Icon name="pencil" size={16} /></button>
                <button onClick={() => deletePras(p.id)} className="p-2 rounded-lg hover:bg-rose-50 text-rose-600"><Icon name="trash-2" size={16} /></button>
              </div>
            </div>
          ))}
        </div>
        <FileUploader sectionId="prestasi_prasarana" onToast={onToast} />
      </Card>

      {/* Sub-Tajuk 3: Analisis SWOT */}
      <Card className="p-6">
        <SectionTitle icon="grid-2x2" title="Analisis SWOT Tahunan PPI" desc="Borang analisis kekuatan, kelemahan, peluang, ancaman" />
        <div className="mb-4"><Field label="Tahun"><Input value={swot.tahun} onChange={e => setSwot({...swot, tahun: e.target.value})} className="max-w-[120px]" /></Field></div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
            <div className="flex items-center gap-2 mb-2"><Icon name="trending-up" size={18} className="text-emerald-600" /><h4 className="font-bold text-emerald-800">Kekuatan (Strengths)</h4></div>
            <Textarea rows={4} value={swot.kekuatan} onChange={e => setSwot({...swot, kekuatan: e.target.value})} placeholder="Cth: Guru PPKI berkelayakan, prasarana asas lengkap..." />
          </div>
          <div className="bg-rose-50 border border-rose-200 rounded-xl p-4">
            <div className="flex items-center gap-2 mb-2"><Icon name="trending-down" size={18} className="text-rose-600" /><h4 className="font-bold text-rose-800">Kelemahan (Weaknesses)</h4></div>
            <Textarea rows={4} value={swot.kelemahan} onChange={e => setSwot({...swot, kelemahan: e.target.value})} placeholder="Cth: Kekurangan alat bantu pendengaran, laluan taktil tidak lengkap..." />
          </div>
          <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
            <div className="flex items-center gap-2 mb-2"><Icon name="target" size={18} className="text-blue-600" /><h4 className="font-bold text-blue-800">Peluang (Opportunities)</h4></div>
            <Textarea rows={4} value={swot.peluang} onChange={e => setSwot({...swot, peluang: e.target.value})} placeholder="Cth: Sokongan PIBG, peruntukan KPM, kursus LDP..." />
          </div>
          <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
            <div className="flex items-center gap-2 mb-2"><Icon name="alert-triangle" size={18} className="text-amber-600" /><h4 className="font-bold text-amber-800">Ancaman (Threats)</h4></div>
            <Textarea rows={4} value={swot.ancaman} onChange={e => setSwot({...swot, ancaman: e.target.value})} placeholder="Cth: Pemindahan guru, kekurangan dana, perubahan dasar..." />
          </div>
        </div>
        <div className="flex justify-end mt-4 gap-2">
          <Btn variant="blue" onClick={() => onToast({ type: 'success', msg: 'Analisis SWOT disimpan.' })}><Icon name="save" size={16} /> Simpan SWOT</Btn>
          <Btn variant="green" onClick={() => generatePDF(swotRef.current, `Analisis_SWOT_PPI_${swot.tahun}.pdf`, onToast, 'PDF analisis SWOT dijana.')}><Icon name="download" size={16} /> Simpan PDF</Btn>
        </div>
        {/* Preview SWOT untuk PDF */}
        <div ref={swotRef} className="bg-white border border-slate-200 rounded-xl p-8 mt-4" style={{ fontFamily: 'Arial, Helvetica, sans-serif', color: '#000' }}>
          <PrintLetterhead sekolah="SK SELAMA (K)" />
          <h3 style={{ textAlign: 'center', fontWeight: 'bold', textDecoration: 'underline', fontSize: '14px', margin: '0 0 16px' }}>ANALISIS SWOT TAHUNAN PROGRAM PENDIDIKAN INKLUSIF {swot.tahun}</h3>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px' }}><tbody>
            <tr>
              <td style={{ border: '1px solid #000', padding: '8px', fontWeight: 'bold', background: '#d4edda', width: '50%', textAlign: 'center' }}>KEKUATAN (STRENGTHS)</td>
              <td style={{ border: '1px solid #000', padding: '8px', fontWeight: 'bold', background: '#f8d7da', width: '50%', textAlign: 'center' }}>KELEMAHAN (WEAKNESSES)</td>
            </tr>
            <tr>
              <td style={{ border: '1px solid #000', padding: '8px', verticalAlign: 'top' }}><pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'Arial, Helvetica, sans-serif' }}>{swot.kekuatan || '________________'}</pre></td>
              <td style={{ border: '1px solid #000', padding: '8px', verticalAlign: 'top' }}><pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'Arial, Helvetica, sans-serif' }}>{swot.kelemahan || '________________'}</pre></td>
            </tr>
            <tr>
              <td style={{ border: '1px solid #000', padding: '8px', fontWeight: 'bold', background: '#d1ecf1', textAlign: 'center' }}>PELUANG (OPPORTUNITIES)</td>
              <td style={{ border: '1px solid #000', padding: '8px', fontWeight: 'bold', background: '#fff3cd', textAlign: 'center' }}>ANCAMAN (THREATS)</td>
            </tr>
            <tr>
              <td style={{ border: '1px solid #000', padding: '8px', verticalAlign: 'top' }}><pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'Arial, Helvetica, sans-serif' }}>{swot.peluang || '________________'}</pre></td>
              <td style={{ border: '1px solid #000', padding: '8px', verticalAlign: 'top' }}><pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'Arial, Helvetica, sans-serif' }}>{swot.ancaman || '________________'}</pre></td>
            </tr>
          </tbody></table>
          <PrintSignature name="Tn. Hj. Abdul Rahman bin Hassan" title="Guru Besar / Pengerusi JPKS" />
        </div>
        <FileUploader sectionId="prestasi_swot" onToast={onToast} />
      </Card>

      {/* Modal Edit PPT */}
      <Modal open={!!editingPpt} onClose={() => setEditingPpt(null)} title={editingPpt?.id ? 'Edit Rekod PPT' : 'Tambah Rekod PPT'}>
        {editingPpt && (
          <div className="space-y-4">
            <Field label="Nama Murid"><Input value={editingPpt.nama} onChange={e => setEditingPpt({...editingPpt, nama: e.target.value})} /></Field>
            <Field label="Kelas"><Input value={editingPpt.kelas} onChange={e => setEditingPpt({...editingPpt, kelas: e.target.value})} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="BM"><Input type="number" value={editingPpt.bm} onChange={e => setEditingPpt({...editingPpt, bm: parseInt(e.target.value)||0})} /></Field>
              <Field label="BI"><Input type="number" value={editingPpt.bi} onChange={e => setEditingPpt({...editingPpt, bi: parseInt(e.target.value)||0})} /></Field>
              <Field label="Matematik"><Input type="number" value={editingPpt.matematik} onChange={e => setEditingPpt({...editingPpt, matematik: parseInt(e.target.value)||0})} /></Field>
              <Field label="Sains"><Input type="number" value={editingPpt.sains} onChange={e => setEditingPpt({...editingPpt, sains: parseInt(e.target.value)||0})} /></Field>
            </div>
            <div className="flex gap-2 justify-end">
              <Btn variant="white" onClick={() => setEditingPpt(null)}>Batal</Btn>
              <Btn variant="blue" onClick={() => savePpt(editingPpt)}><Icon name="save" size={16} /> Simpan</Btn>
            </div>
          </div>
        )}
      </Modal>

      {/* Modal Edit Prasarana */}
      <Modal open={!!editPras} onClose={() => setEditPras(null)} title={editPras?.id ? 'Edit Item Prasarana' : 'Tambah Item Prasarana'}>
        {editPras && (
          <div className="space-y-4">
            <Field label="Item"><Input value={editPras.item} onChange={e => setEditPras({...editPras, item: e.target.value})} /></Field>
            <Field label="Lokasi"><Input value={editPras.lokasi} onChange={e => setEditPras({...editPras, lokasi: e.target.value})} /></Field>
            <Field label="Status"><Select value={editPras.status} onChange={e => setEditPras({...editPras, status: e.target.value})}>
              <option>Ada</option><option>Tiada</option><option>Dalam Penambahbaikan</option>
            </Select></Field>
            <Field label="Catatan"><Textarea rows={2} value={editPras.catatan} onChange={e => setEditPras({...editPras, catatan: e.target.value})} /></Field>
            <div className="flex gap-2 justify-end">
              <Btn variant="white" onClick={() => setEditPras(null)}>Batal</Btn>
              <Btn variant="blue" onClick={() => savePras(editPras)}><Icon name="save" size={16} /> Simpan</Btn>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============================================================
   TAB 4 — ONE PAGE REPORT (OPR) AKTIVITI INKLUSIF PINTAR AI
   ============================================================ */
function TabOPR({ onToast }) {
  const [form, setForm] = useState({
    tajuk: '', tarikh: new Date().toISOString().slice(0, 10), masa: '', tempat: '',
    penganjur: 'Jawatankuasa Program Pendidikan Inklusif (JPKS) SK Selama (K)',
    sasaran: 'Murid Berkeperluan Khas (MBK) & Murid Arus Perdana',
  });
  const [points, setPoints] = useState(['', '', '', '']);
  const [photos, setPhotos] = useState([]);          // { src, name, url }
  const [ulasan, setUlasan] = useState('');
  const [loading, setLoading] = useState(false);
  const [uploading, setUploading] = useState(false);
  const [drag, setDrag] = useState(false);
  const printRef = useRef(null);
  const fileRef = useRef(null);
  const camRef = useRef(null);

  const setPoint = (i, v) => setPoints(points.map((p, j) => (j === i ? v : p)));

  const addFiles = async (files) => {
    const list = Array.from(files || []).filter(f => f.type.startsWith('image/'));
    if (!list.length) return;
    const added = [];
    for (const f of list) {
      const src = await fileToBase64(f);
      added.push({ src, name: f.name || ('gambar-' + Date.now() + '.jpg'), url: '' });
    }
    setPhotos(prev => [...prev, ...added].slice(0, 8));
    onToast({ type: 'success', msg: added.length + ' gambar ditambah.' });
  };

  const removePhoto = (i) => setPhotos(photos.filter((_, j) => j !== i));

  const simpanKeDrive = async () => {
    if (!photos.length) { onToast({ type: 'error', msg: 'Tiada gambar untuk dimuat naik.' }); return; }
    setUploading(true);
    try {
      const updated = [...photos];
      for (let i = 0; i < updated.length; i++) {
        if (updated[i].url) continue;
        const res = await uploadFile(updated[i].src, updated[i].name, 'OPR: ' + (form.tajuk || 'Aktiviti Inklusif'));
        if (res.ok) updated[i] = { ...updated[i], url: res.data.url };
        else throw new Error(res.error);
      }
      setPhotos(updated);
      onToast({ type: 'success', msg: 'Gambar dimuat naik ke Google Drive.' });
    } catch (e) {
      onToast({ type: 'error', msg: 'Muat naik gagal: ' + e.message });
    }
    setUploading(false);
  };

  const janaUlasan = async () => {
    const isi = points.filter(p => p.trim());
    if (!form.tajuk.trim() || !isi.length) {
      onToast({ type: 'error', msg: 'Sila isi tajuk aktiviti dan sekurang-kurangnya satu bullet point.' });
      return;
    }
    setLoading(true);
    try {
      const prompt =
        'Olah maklumat ringkas berikut menjadi ULASAN HURAIAN LAPORAN RASMI Kementerian Pendidikan Malaysia (KPM) ' +
        'sebanyak TEPAT 3 perenggan penuh dalam Bahasa Melayu baku dan formal. ' +
        'Perenggan 1: latar belakang & objektif aktiviti. Perenggan 2: pelaksanaan & penglibatan peserta. ' +
        'Perenggan 3: impak, refleksi dan cadangan penambahbaikan selaras Program Pendidikan Inklusif (SPI Bil. 1/2026). ' +
        'Jangan gunakan tajuk kecil, senarai bullet, atau markdown. Hanya 3 perenggan teks.\n\n' +
        'Tajuk Aktiviti: ' + form.tajuk + '\n' +
        'Tarikh: ' + form.tarikh + (form.masa ? ' (' + form.masa + ')' : '') + '\n' +
        'Tempat: ' + (form.tempat || 'SK Selama (K)') + '\n' +
        'Penganjur: ' + form.penganjur + '\n' +
        'Kumpulan Sasaran: ' + form.sasaran + '\n' +
        'Point ringkas:\n- ' + isi.join('\n- ');
      const teks = await aiCall(prompt);
      setUlasan(String(teks).trim());
      onToast({ type: 'success', msg: 'Ulasan OPR dijana oleh AI Groq (Llama 3.3).' });
    } catch (e) {
      onToast({ type: 'error', msg: e.message });
    }
    setLoading(false);
  };

  const perenggan = ulasan ? ulasan.split(/\n\s*\n/).filter(x => x.trim()) : [];

  return (
    <div className="space-y-6 fade-in">
      <Card className="p-6">
        <SectionTitle icon="sparkles" title="One Page Report (OPR) Aktiviti Inklusif — Pintar AI"
          desc="Masukkan point ringkas, AI Groq Llama 3.3 akan mengolah menjadi ulasan laporan rasmi KPM." />
        <div className="grid sm:grid-cols-2 gap-4">
          <Field label="Tajuk Aktiviti" className="sm:col-span-2">
            <Input value={form.tajuk} onChange={e => setForm({ ...form, tajuk: e.target.value })} placeholder="Cth: Program Sahabat Inklusif Bersama MBK" />
          </Field>
          <Field label="Tarikh"><Input type="date" value={form.tarikh} onChange={e => setForm({ ...form, tarikh: e.target.value })} /></Field>
          <Field label="Masa"><Input value={form.masa} onChange={e => setForm({ ...form, masa: e.target.value })} placeholder="Cth: 8.00 pagi - 12.30 tengah hari" /></Field>
          <Field label="Tempat"><Input value={form.tempat} onChange={e => setForm({ ...form, tempat: e.target.value })} placeholder="Cth: Dewan Seri Selama" /></Field>
          <Field label="Penganjur"><Input value={form.penganjur} onChange={e => setForm({ ...form, penganjur: e.target.value })} /></Field>
          <Field label="Kumpulan Sasaran" className="sm:col-span-2"><Input value={form.sasaran} onChange={e => setForm({ ...form, sasaran: e.target.value })} /></Field>
        </div>

        <div className="mt-5">
          <p className="text-sm font-semibold text-slate-700 mb-2">Point Ringkas Aktiviti (3–4 point)</p>
          <div className="space-y-2">
            {points.map((p, i) => (
              <div key={i} className="flex items-center gap-2">
                <span className="w-7 h-7 flex-shrink-0 rounded-lg bg-blue-100 text-blue-700 text-xs font-bold flex items-center justify-center">{i + 1}</span>
                <Input value={p} onChange={e => setPoint(i, e.target.value)} placeholder={'Point ringkas ' + (i + 1)} />
              </div>
            ))}
          </div>
        </div>

        <div className="mt-5 flex flex-wrap gap-2">
          <Btn variant="blue" onClick={janaUlasan} disabled={loading}>
            <Icon name={loading ? 'loader' : 'wand-2'} size={16} /> {loading ? 'AI sedang mengolah...' : 'Jana Ulasan AI (3 Perenggan)'}
          </Btn>
          <Btn variant="white" onClick={() => { setUlasan(''); setPoints(['', '', '', '']); }}>
            <Icon name="rotate-ccw" size={16} /> Set Semula
          </Btn>
        </div>
      </Card>

      {/* GAMBAR AKTIVITI */}
      <Card className="p-6">
        <SectionTitle icon="camera" title="Gambar Aktiviti" desc="Heret & lepas fail gambar, atau ambil gambar terus menggunakan kamera telefon." />
        <div
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={e => { e.preventDefault(); setDrag(false); addFiles(e.dataTransfer.files); }}
          className={`rounded-2xl border-2 border-dashed p-8 text-center transition-all ${drag ? 'border-blue-500 bg-blue-50' : 'border-slate-300 bg-slate-50'}`}>
          <Icon name="image-plus" size={36} className="mx-auto text-slate-400 mb-2" />
          <p className="text-sm text-slate-600 font-medium">Heret gambar ke sini</p>
          <p className="text-xs text-slate-400 mb-4">Maksimum 8 gambar &middot; JPG / PNG</p>
          <div className="flex flex-wrap gap-2 justify-center">
            <Btn variant="white" onClick={() => fileRef.current && fileRef.current.click()}><Icon name="folder-open" size={16} /> Pilih Fail</Btn>
            <Btn variant="green" onClick={() => camRef.current && camRef.current.click()}><Icon name="camera" size={16} /> Ambil Gambar / Snap Photo</Btn>
            <Btn variant="amber" onClick={simpanKeDrive} disabled={uploading || !photos.length}>
              <Icon name="cloud-upload" size={16} /> {uploading ? 'Memuat naik...' : 'Simpan Gambar ke Drive'}
            </Btn>
          </div>
          <input ref={fileRef} type="file" accept="image/*" multiple className="hidden" onChange={e => { addFiles(e.target.files); e.target.value = ''; }} />
          <input ref={camRef} type="file" accept="image/*" capture="environment" className="hidden" onChange={e => { addFiles(e.target.files); e.target.value = ''; }} />
        </div>

        {photos.length > 0 && (
          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-4">
            {photos.map((ph, i) => (
              <div key={i} className="relative group rounded-xl overflow-hidden border border-slate-200 shadow-sm">
                <img src={ph.src} alt={'Gambar aktiviti ' + (i + 1)} className="w-full h-28 object-cover" />
                {ph.url && <span className="absolute top-1 left-1"><Badge color="green">Drive</Badge></span>}
                <button onClick={() => removePhoto(i)} className="absolute top-1 right-1 bg-rose-600 text-white rounded-lg p-1 opacity-0 group-hover:opacity-100 transition-opacity">
                  <Icon name="trash-2" size={14} />
                </button>
              </div>
            ))}
          </div>
        )}
      </Card>

      {/* PRATONTON OPR */}
      <Card className="p-6">
        <div className="flex flex-wrap items-center justify-between gap-2 mb-4">
          <SectionTitle icon="file-text" title="Pratonton One Page Report" desc="Dokumen rasmi sedia untuk dicetak." />
          <Btn variant="rose" onClick={() => generatePDF(printRef.current, 'OPR_' + (form.tajuk || 'Aktiviti').replace(/[^\w]+/g, '_') + '.pdf', onToast, 'PDF OPR dijana.')}>
            <Icon name="printer" size={16} /> Simpan PDF OPR
          </Btn>
        </div>

        <div ref={printRef} className="bg-white p-8 border border-slate-200 rounded-xl" style={{ fontFamily: 'Arial, Helvetica, sans-serif' }}>
          <PrintLetterhead sekolah="SK SELAMA (K)" />
          <h2 style={{ textAlign: 'center', fontSize: '15px', fontWeight: 'bold', textDecoration: 'underline', marginBottom: '4px' }}>
            ONE PAGE REPORT (OPR) — AKTIVITI PENDIDIKAN INKLUSIF
          </h2>
          <p style={{ textAlign: 'center', fontSize: '11px', marginBottom: '16px' }}>Program Pendidikan Inklusif &middot; SPI Bil. 1/2026</p>

          <table style={{ width: '100%', fontSize: '12px', borderCollapse: 'collapse', marginBottom: '16px' }}>
            <tbody>
              {[['TAJUK AKTIVITI', form.tajuk || '—'],
                ['TARIKH / MASA', formatDate(form.tarikh) + (form.masa ? ' (' + form.masa + ')' : '')],
                ['TEMPAT', form.tempat || 'SK Selama (K)'],
                ['PENGANJUR', form.penganjur],
                ['KUMPULAN SASARAN', form.sasaran]].map((r, i) => (
                <tr key={i}>
                  <td style={{ border: '1px solid #000', padding: '6px 8px', fontWeight: 'bold', width: '32%', background: '#eff6ff' }}>{r[0]}</td>
                  <td style={{ border: '1px solid #000', padding: '6px 8px' }}>{r[1]}</td>
                </tr>
              ))}
            </tbody>
          </table>

          <h3 style={{ fontSize: '12px', fontWeight: 'bold', marginBottom: '6px' }}>ULASAN &amp; HURAIAN LAPORAN</h3>
          <div style={{ fontSize: '12px', lineHeight: 1.7, textAlign: 'justify', marginBottom: '16px' }}>
            {perenggan.length
              ? perenggan.map((t, i) => <p key={i} style={{ marginBottom: '10px', textIndent: '24px' }}>{t}</p>)
              : <p style={{ color: '#94a3b8' }}>Ulasan belum dijana. Klik "Jana Ulasan AI (3 Perenggan)".</p>}
          </div>

          <h3 style={{ fontSize: '12px', fontWeight: 'bold', marginBottom: '8px' }}>DOKUMENTASI BERGAMBAR</h3>
          {photos.length ? (
            <table style={{ width: '100%', borderCollapse: 'separate', borderSpacing: '8px' }}>
              <tbody>
                {Array.from({ length: Math.ceil(photos.length / 2) }).map((_, r) => (
                  <tr key={r}>
                    {[0, 1].map(c => {
                      const ph = photos[r * 2 + c];
                      return (
                        <td key={c} style={{ width: '50%', verticalAlign: 'top' }}>
                          {ph ? (
                            <div style={{ border: '1px solid #cbd5e1', borderRadius: '10px', padding: '6px', background: '#f8fafc' }}>
                              <img src={ph.src} alt={'Dokumentasi ' + (r * 2 + c + 1)} style={{ width: '100%', height: '150px', objectFit: 'cover', borderRadius: '6px' }} />
                              <p style={{ fontSize: '10px', textAlign: 'center', marginTop: '4px', color: '#475569' }}>Gambar {r * 2 + c + 1}</p>
                            </div>
                          ) : null}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </tbody>
            </table>
          ) : <p style={{ fontSize: '11px', color: '#94a3b8' }}>Tiada gambar dilampirkan.</p>}

          <PrintSignature name="En. Ahmad bin Isa" title="Penyelaras PPKI / Guru Pendidikan Inklusif" />
        </div>
      </Card>
    </div>
  );
}

function App() {
  const [activeTab, setActiveTab] = useState('tadbir');
  const [toast, setToast] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);

  const onToast = useCallback((t) => setToast(t), []);
  const closeToast = useCallback(() => setToast(null), []);

  return (
    <div className="min-h-screen bg-blue-50/30">
      <Header onSettings={() => setSettingsOpen(true)} />
      <TabNav active={activeTab} onChange={setActiveTab} />
      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        {activeTab === 'tadbir' && <TabTadbirUrus onToast={onToast} />}
        {activeTab === 'sumber' && <TabSumberManusia onToast={onToast} />}
        {activeTab === 'profil' && <TabProfilMBK onToast={onToast} />}
        {activeTab === 'prestasi' && <TabPrestasi onToast={onToast} />}
        {activeTab === 'opr' && <TabOPR onToast={onToast} />}
      </main>
      <footer className="max-w-7xl mx-auto px-4 sm:px-6 py-6 text-center text-xs text-slate-400">
        <p>Sistem Pengurusan JPKS SK Selama (K) &middot; Program Pendidikan Inklusif 2026 &middot; Pekeliling SPI Bil. 1/2026</p>
      </footer>
      <Toast toast={toast} onClose={closeToast} />
      <SettingsModal open={settingsOpen} onClose={() => setSettingsOpen(false)} onSave={() => { setSettingsOpen(false); onToast({ type: 'success', msg: 'URL API disimpan.' }); }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
