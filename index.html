async function apiCall(action, payload = {}) {
  if (!API_URL) return { ok: false, error: 'URL API belum ditetapkan. Buka Tetapan untuk masukkan URL Web App.' };
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload }),
    });
    const text = await res.text();
    let data;
    try { data = JSON.parse(text); } catch { return { ok: false, error: 'Respon API tidak sah: ' + text.slice(0, 200) }; }
    return data;
  } catch (e) {
    return { ok: false, error: e.message };
  }
}

/* ============================================================

function Icon({ name, size = 18, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide) {
      ref.current.innerHTML = '';
      const svg = window.lucide.createElement
        ? window.lucide.createElement(window.lucide.icons[toPascalCase(name)])
        : null;
      if (svg) { svg.setAttribute('width', size); svg.setAttribute('height', size); ref.current.appendChild(svg); }
      else ref.current.setAttribute('data-lucide', name);
    }
    if (ref.current && window.lucide && window.lucide.createIcons) window.lucide.createIcons({ attrs: { width: size, height: size }, nameAttr: 'data-lucide' });
  }, [name, size]);
  return <span ref={ref} data-lucide={name} className={'inline-flex items-center ' + className} style={{ width: size, height: size }} />;
}
function toPascalCase(s) { return s.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(''); }

function Toast({ toast, onClose }) {
  useEffect(() => {
    if (toast) { const t = setTimeout(onClose, 3500); return () => clearTimeout(t); }
  }, [toast, onClose]);
  if (!toast) return null;
  const colors = { success: 'bg-emerald-600', error: 'bg-rose-600', info: 'bg-blue-600' };
  return (
    <div className="fixed bottom-6 right-6 z-[60] slide-up">
      <div className={`${colors[toast.type] || colors.info} text-white px-5 py-3 rounded-xl shadow-lg flex items-center gap-2 max-w-sm`}>

        <span className="text-sm font-medium">{toast.msg}</span>
      </div>
    </div>
  );
}

    if (t.id) {
      setTeachers(teachers.map(x => x.id === t.id ? t : x));

/* ============================================================
   TAB 3: PROFIL MBK, SARINGAN & MINDA AI

function TabProfilMBK({ onToast }) {
  const [students, setStudents] = useState(DEFAULT_STUDENTS);
  const [editing, setEditing] = useState(null);
  const [aiInput, setAiInput] = useState('');
  const [aiResult, setAiResult] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);

  function saveStudent(s) {
    if (s.id) {
      setStudents(students.map(x => x.id === s.id ? s : x));
      onToast({ type: 'success', msg: 'Profil murid dikemas kini.' });
    } else {
      setStudents([...students, { ...s, id: 's' + Date.now() }]);
      onToast({ type: 'success', msg: 'Profil murid baharu ditambah.' });
    }
    setEditing(null);
  }
  function deleteStudent(id) {
    setStudents(students.filter(s => s.id !== id));
    onToast({ type: 'success', msg: 'Profil murid dipadam.' });
  }
  function getMarkahColor(m) {
    if (m >= 80) return 'green';
    if (m >= 60) return 'blue';
    if (m >= 40) return 'amber';
    return 'rose';
  }
  function runAI() {
    if (!aiInput.trim()) { onToast({ type: 'error', msg: 'Sila masukkan soalan atau data murid.' }); return; }
    setAiLoading(true);
    setTimeout(() => {
      const input = aiInput.toLowerCase();
      let result = '';
      if (input.includes('amirul')) {
        result = `Analisis Minda AI untuk Muhammad Amirul bin Roslan:\n\n• Diagnosis: Slow Learner (Markah Saringan: 64)\n• Status: Layak Inklusif Separa (Bukan Akademik)\n\nCadangan Intervensi:\n1. Penggunaan bahan bantu mengajar visual dan kinestetik\n2. Masa tugasan dipendekkan dengan rehat lebih kerap\n3. Penempatan di barisan hadapan untuk tumpuan optimum\n4. Bimbingan sosial untuk kemahiran interaksi rakan\n5. Penilaian formatif berterusan setiap 2 minggu`;
      } else if (input.includes('wei han') || input.includes('chong')) {
        result = `Analisis Minda AI untuk Chong Wei Han:\n\n• Diagnosis: Masalah Pendengaran (Markah Saringan: 76)\n• Status: Layak Inklusif Separa (Akademik)\n\nCadangan Intervensi:\n1. Penggunaan FM System / gelung pendengaran dalam kelas\n2. Arahan visual dan penambahan teks pada papan tulis\n3. Tempat duduk menghadap guru untuk pembacaan bibir\n4. Rakan pendamping (peer tutoring) untuk nota tambahan\n5. Penilaian lisan digantikan dengan bertulis/visual`;
      } else if (input.includes('farah')) {
        result = `Analisis Minda AI untuk Farah Shahidah binti Ahmad:\n\n• Diagnosis: Autisme Ringan (Markah Saringan: 84)\n• Status: Layak Inklusif Separa (Akademik)\n\nCadangan Intervensi:\n1. Struktur rutin harian yang jelas dan boleh ramal\n2. Visual schedule untuk pengurusan transisi aktiviti\n3. Ruang tenang (quiet corner) jika berlaku sensory overload\n4. Sosial cerita (social stories) untuk interaksi rakan\n5. Pengukuhan positif untuk pencapaian akademik`;
      } else {
        result = `Analisis Minda AI:\n\nBerdasarkan input yang diberikan, sistem mengesyorkan:\n1. Jalankan saringan PMD untuk pengesahan diagnosis\n2. Tetapkan jenis inklusif (separa/penuh) berdasarkan markah saringan\n3. Lampirkan guru pendamping mengikut keperluan\n4. Sediakan pelan intervensen individu (IEP) untuk setiap murid\n5. Pemantauan dan penilaian berkala oleh JPKS\n\nTip: Taip nama murid (Amirul, Wei Han, atau Farah) untuk analisis spesifik.`;
      }
      setAiResult(result);
      setAiLoading(false);
    }, 1200);
  }

  return (
    <div className="space-y-6 fade-in">
      {/* Sub-Tajuk 1: Pangkalan Data Murid Inklusif */}
      <Card className="p-6">
        <div className="flex items-center justify-between mb-4">
          <SectionTitle icon="database" title="Pangkalan Data Murid Inklusif" desc="Profil murid PPKI dengan saringan dan status penempatan" />
          <Btn variant="blue" onClick={() => setEditing({ id: '', nama: '', mykid: '', oku: '', diagnosis: '', kelas: '', jenis: 'Inklusif Separa', guru_mentor: '', markah_saringan: 0, status: '' })}><Icon name="plus" size={16} /> Tambah Murid</Btn>
        </div>
        <div className="space-y-4">
          {students.map(s => (
            <div key={s.id} className="border border-slate-200 rounded-2xl p-4 hover:shadow-md transition-shadow">
              <div className="flex flex-wrap items-start justify-between gap-3">
                <div className="flex-1 min-w-[200px]">
                  <div className="flex items-center gap-2 mb-2">
                    <h4 className="font-bold text-slate-900">{s.nama}</h4>
                    <Badge color={getMarkahColor(s.markah_saringan)}>Saringan: {s.markah_saringan}</Badge>
                  </div>
                  <div className="grid grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-1 text-sm">
                    <p className="text-slate-500">MyKid: <span className="font-medium text-slate-700">{s.mykid}</span></p>
                    <p className="text-slate-500">OKU: <span className="font-medium text-slate-700">{s.oku}</span></p>
                    <p className="text-slate-500">Diagnosis: <span className="font-medium text-slate-700">{s.diagnosis}</span></p>
                    <p className="text-slate-500">Kelas: <span className="font-medium text-slate-700">{s.kelas}</span></p>
                    <p className="text-slate-500">Jenis: <span className="font-medium text-slate-700">{s.jenis}</span></p>
                    <p className="text-slate-500">Mentor: <span className="font-medium text-slate-700">{s.guru_mentor}</span></p>
                  </div>
                  <div className="mt-2"><Badge color={s.status.includes('Akademik') ? 'green' : 'amber'}>{s.status}</Badge></div>
                </div>
                <div className="flex gap-2">
                  <button onClick={() => setEditing({...s})} className="p-2 rounded-lg hover:bg-blue-50 text-blue-600"><Icon name="pencil" size={16} /></button>
                  <button onClick={() => deleteStudent(s.id)} className="p-2 rounded-lg hover:bg-rose-50 text-rose-600"><Icon name="trash-2" size={16} /></button>
                </div>
              </div>
            </div>
          ))}
        </div>
      </Card>

      {/* Minda AI */}
      <Card className="p-6">
        <SectionTitle icon="brain" title="Minda AI — Analisis Intervensi Inklusif" desc="Masukkan nama murid untuk cadangan intervensen AI" />
        <div className="space-y-4">
          <div className="flex gap-2">
            <Input value={aiInput} onChange={e => setAiInput(e.target.value)} placeholder="Cth: Analisis Amirul / Cadangan untuk Wei Han" onKeyDown={e => e.key === 'Enter' && runAI()} />
            <Btn variant="blue" onClick={runAI} disabled={aiLoading}><Icon name="sparkles" size={16} /> {aiLoading ? 'Menganalisis...' : 'Analisis'}</Btn>
          </div>
          {aiLoading && <Loading msg="Minda AI sedang menganalisis..." />}
          {aiResult && !aiLoading && (
            <div className="bg-blue-50/50 border border-blue-100 rounded-xl p-5 slide-up">
              <pre className="text-sm text-slate-700 whitespace-pre-wrap font-sans leading-relaxed">{aiResult}</pre>
            </div>
          )}
        </div>
      </Card>

      {/* Modal Edit Murid */}
      <Modal open={!!editing} onClose={() => setEditing(null)} title={editing?.id ? 'Edit Profil Murid' : 'Tambah Murid Inklusif'} wide>
        {editing && (
          <div className="space-y-4">
            <Field label="Nama Murid"><Input value={editing.nama} onChange={e => setEditing({...editing, nama: e.target.value})} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="No. MyKid"><Input value={editing.mykid} onChange={e => setEditing({...editing, mykid: e.target.value})} /></Field>
              <Field label="No. OKU"><Input value={editing.oku} onChange={e => setEditing({...editing, oku: e.target.value})} /></Field>
              <Field label="Diagnosis"><Input value={editing.diagnosis} onChange={e => setEditing({...editing, diagnosis: e.target.value})} /></Field>
              <Field label="Kelas"><Input value={editing.kelas} onChange={e => setEditing({...editing, kelas: e.target.value})} /></Field>
              <Field label="Jenis Inklusif"><Select value={editing.jenis} onChange={e => setEditing({...editing, jenis: e.target.value})}>
                <option>Inklusif Separa</option><option>Inklusif Penuh</option>
              </Select></Field>
              <Field label="Guru Mentor"><Input value={editing.guru_mentor} onChange={e => setEditing({...editing, guru_mentor: e.target.value})} /></Field>
              <Field label="Markah Saringan"><Input type="number" value={editing.markah_saringan} onChange={e => setEditing({...editing, markah_saringan: parseInt(e.target.value) || 0})} /></Field>
              <Field label="Status"><Input value={editing.status} onChange={e => setEditing({...editing, status: e.target.value})} /></Field>
            </div>
            <div className="flex gap-2 justify-end">
              <Btn variant="white" onClick={() => setEditing(null)}>Batal</Btn>
              <Btn variant="blue" onClick={() => saveStudent(editing)}><Icon name="save" size={16} /> Simpan</Btn>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============================================================
   TAB 4: PRESTASI & PELAPORAN
   ============================================================ */
function TabPrestasi({ onToast }) {
  const [ppt, setPpt] = useState(DEFAULT_PPT);
  const [editingPpt, setEditingPpt] = useState(null);
  const [prasarana, setPrasarana] = useState(DEFAULT_PRASARANA);
  const [editPras, setEditPras] = useState(null);
  const [swot, setSwot] = useState({ kekuatan: '', kelemahan: '', peluang: '', ancaman: '', tahun: '2026' });

  function savePpt(p) {
    if (p.id) { setPpt(ppt.map(x => x.id === p.id ? p : x)); onToast({ type: 'success', msg: 'Keputusan PPT dikemas kini.' }); }
    else { setPpt([...ppt, { ...p, id: 'p' + Date.now() }]); onToast({ type: 'success', msg: 'Rekod PPT ditambah.' }); }
    setEditingPpt(null);
  }
  function deletePpt(id) { setPpt(ppt.filter(p => p.id !== id)); onToast({ type: 'success', msg: 'Rekod PPT dipadam.' }); }
  function savePras(p) {
    if (p.id) { setPrasarana(prasarana.map(x => x.id === p.id ? p : x)); onToast({ type: 'success', msg: 'Inventori dikemas kini.' }); }
    else { setPrasarana([...prasarana, { ...p, id: 'pr' + Date.now() }]); onToast({ type: 'success', msg: 'Item prasarana ditambah.' }); }
    setEditPras(null);
  }
  function deletePras(id) { setPrasarana(prasarana.filter(p => p.id !== id)); onToast({ type: 'success', msg: 'Item prasarana dipadam.' }); }
  function getGrade(m) { if (m >= 80) return 'A'; if (m >= 70) return 'B'; if (m >= 60) return 'C'; if (m >= 50) return 'D'; return 'E'; }
  function getGradeColor(g) { if (g === 'A') return 'green'; if (g === 'B') return 'blue'; if (g === 'C') return 'amber'; return 'rose'; }

  return (
    <div className="space-y-6 fade-in">
      {/* Sub-Tajuk 1: Rekod Prestasi PPT 2026 */}
      <Card className="p-6">
        <div className="flex items-center justify-between mb-4">
          <SectionTitle icon="bar-chart-3" title="Rekod Prestasi PPT 2026" desc="Keputusan peperiksaan subjek teras murid inklusif" />
          <Btn variant="blue" onClick={() => setEditingPpt({ id: '', nama: '', kelas: '', bm: 0, bi: 0, matematik: 0, sains: 0 })}><Icon name="plus" size={16} /> Tambah Rekod</Btn>
        </div>
        <div className="overflow-x-auto">
          <table className="w-full text-sm">
            <thead>
              <tr className="border-b border-slate-200 text-left text-slate-500">
                <th className="py-3 px-4 font-semibold">Nama</th>
                <th className="py-3 px-4 font-semibold">Kelas</th>
                <th className="py-3 px-4 font-semibold text-center">BM</th>
                <th className="py-3 px-4 font-semibold text-center">BI</th>
                <th className="py-3 px-4 font-semibold text-center">Matematik</th>
                <th className="py-3 px-4 font-semibold text-center">Sains</th>
                <th className="py-3 px-4 font-semibold text-center">Gred</th>
                <th className="py-3 px-4 font-semibold text-right">Tindakan</th>
              </tr>
            </thead>
            <tbody>
              {ppt.map(p => {
                const avg = Math.round((p.bm + p.bi + p.matematik + p.sains) / 4);
                const grade = getGrade(avg);
                return (
                  <tr key={p.id} className="border-b border-slate-100 hover:bg-slate-50/50">
                    <td className="py-3 px-4 font-semibold text-slate-900">{p.nama}</td>
                    <td className="py-3 px-4 text-slate-600">{p.kelas}</td>
                    <td className="py-3 px-4 text-center font-medium">{p.bm}</td>
                    <td className="py-3 px-4 text-center font-medium">{p.bi}</td>
                    <td className="py-3 px-4 text-center font-medium">{p.matematik}</td>
                    <td className="py-3 px-4 text-center font-medium">{p.sains}</td>
                    <td className="py-3 px-4 text-center"><Badge color={getGradeColor(grade)}>{grade} ({avg})</Badge></td>
                    <td className="py-3 px-4">
                      <div className="flex gap-2 justify-end">
                        <button onClick={() => setEditingPpt({...p})} className="p-2 rounded-lg hover:bg-blue-50 text-blue-600"><Icon name="pencil" size={16} /></button>
                        <button onClick={() => deletePpt(p.id)} className="p-2 rounded-lg hover:bg-rose-50 text-rose-600"><Icon name="trash-2" size={16} /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      </Card>

      {/* Sub-Tajuk 2: Inventori Prasarana OKU */}
      <Card className="p-6">
        <div className="flex items-center justify-between mb-4">
          <SectionTitle icon="accessibility" title="Inventori Prasarana OKU" desc="Checklist kemudahan fizikal mesra OKU" />
          <Btn variant="blue" onClick={() => setEditPras({ id: '', item: '', lokasi: '', status: 'Ada', catatan: '' })}><Icon name="plus" size={16} /> Tambah Item</Btn>
        </div>
        <div className="space-y-3">
          {prasarana.map(p => (
            <div key={p.id} className="flex items-center justify-between gap-3 border border-slate-200 rounded-xl p-4 hover:shadow-sm transition-shadow">
              <div className="flex items-center gap-3 flex-1">
                <div className={`w-10 h-10 rounded-xl flex items-center justify-center ${p.status === 'Ada' ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'}`}>
                  <Icon name={p.status === 'Ada' ? 'check' : 'x'} size={20} />
                </div>
                <div>
                  <p className="font-semibold text-slate-900">{p.item}</p>
                  <p className="text-xs text-slate-500">{p.lokasi} — {p.catatan}</p>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <Badge color={p.status === 'Ada' ? 'green' : 'rose'}>{p.status}</Badge>
                <button onClick={() => setEditPras({...p})} className="p-2 rounded-lg hover:bg-blue-50 text-blue-600"><Icon name="pencil" size={16} /></button>
                <button onClick={() => deletePras(p.id)} className="p-2 rounded-lg hover:bg-rose-50 text-rose-600"><Icon name="trash-2" size={16} /></button>
              </div>
            </div>
          ))}
        </div>
      </Card>

      {/* Sub-Tajuk 3: Analisis SWOT */}
      <Card className="p-6">
        <SectionTitle icon="grid-2x2" title="Analisis SWOT Tahunan PPI" desc="Borang analisis kekuatan, kelemahan, peluang, ancaman" />
        <div className="mb-4"><Field label="Tahun"><Input value={swot.tahun} onChange={e => setSwot({...swot, tahun: e.target.value})} className="max-w-[120px]" /></Field></div>
        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-4">
            <div className="flex items-center gap-2 mb-2"><Icon name="trending-up" size={18} className="text-emerald-600" /><h4 className="font-bold text-emerald-800">Kekuatan (Strengths)</h4></div>
            <Textarea rows={4} value={swot.kekuatan} onChange={e => setSwot({...swot, kekuatan: e.target.value})} placeholder="Cth: Guru PPKI berkelayakan, prasarana asas lengkap..." />
          </div>
          <div className="bg-rose-50 border border-rose-200 rounded-xl p-4">
            <div className="flex items-center gap-2 mb-2"><Icon name="trending-down" size={18} className="text-rose-600" /><h4 className="font-bold text-rose-800">Kelemahan (Weaknesses)</h4></div>
            <Textarea rows={4} value={swot.kelemahan} onChange={e => setSwot({...swot, kelemahan: e.target.value})} placeholder="Cth: Kekurangan alat bantu pendengaran, laluan taktil tidak lengkap..." />
          </div>
          <div className="bg-blue-50 border border-blue-200 rounded-xl p-4">
            <div className="flex items-center gap-2 mb-2"><Icon name="target" size={18} className="text-blue-600" /><h4 className="font-bold text-blue-800">Peluang (Opportunities)</h4></div>
            <Textarea rows={4} value={swot.peluang} onChange={e => setSwot({...swot, peluang: e.target.value})} placeholder="Cth: Sokongan PIBG, peruntukan KPM, kursus LDP..." />
          </div>
          <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
            <div className="flex items-center gap-2 mb-2"><Icon name="alert-triangle" size={18} className="text-amber-600" /><h4 className="font-bold text-amber-800">Ancaman (Threats)</h4></div>
            <Textarea rows={4} value={swot.ancaman} onChange={e => setSwot({...swot, ancaman: e.target.value})} placeholder="Cth: Pemindahan guru, kekurangan dana, perubahan dasar..." />
          </div>
        </div>
        <div className="flex justify-end mt-4"><Btn variant="blue" onClick={() => onToast({ type: 'success', msg: 'Analisis SWOT disimpan.' })}><Icon name="save" size={16} /> Simpan SWOT</Btn></div>
      </Card>

      {/* Modal Edit PPT */}
      <Modal open={!!editingPpt} onClose={() => setEditingPpt(null)} title={editingPpt?.id ? 'Edit Rekod PPT' : 'Tambah Rekod PPT'}>
        {editingPpt && (
          <div className="space-y-4">
            <Field label="Nama Murid"><Input value={editingPpt.nama} onChange={e => setEditingPpt({...editingPpt, nama: e.target.value})} /></Field>
            <Field label="Kelas"><Input value={editingPpt.kelas} onChange={e => setEditingPpt({...editingPpt, kelas: e.target.value})} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="BM"><Input type="number" value={editingPpt.bm} onChange={e => setEditingPpt({...editingPpt, bm: parseInt(e.target.value)||0})} /></Field>
              <Field label="BI"><Input type="number" value={editingPpt.bi} onChange={e => setEditingPpt({...editingPpt, bi: parseInt(e.target.value)||0})} /></Field>
              <Field label="Matematik"><Input type="number" value={editingPpt.matematik} onChange={e => setEditingPpt({...editingPpt, matematik: parseInt(e.target.value)||0})} /></Field>
              <Field label="Sains"><Input type="number" value={editingPpt.sains} onChange={e => setEditingPpt({...editingPpt, sains: parseInt(e.target.value)||0})} /></Field>
            </div>
            <div className="flex gap-2 justify-end">
              <Btn variant="white" onClick={() => setEditingPpt(null)}>Batal</Btn>
              <Btn variant="blue" onClick={() => savePpt(editingPpt)}><Icon name="save" size={16} /> Simpan</Btn>
            </div>
          </div>
        )}
      </Modal>

      {/* Modal Edit Prasarana */}
      <Modal open={!!editPras} onClose={() => setEditPras(null)} title={editPras?.id ? 'Edit Item Prasarana' : 'Tambah Item Prasarana'}>
        {editPras && (
          <div className="space-y-4">
            <Field label="Item"><Input value={editPras.item} onChange={e => setEditPras({...editPras, item: e.target.value})} /></Field>
            <Field label="Lokasi"><Input value={editPras.lokasi} onChange={e => setEditPras({...editPras, lokasi: e.target.value})} /></Field>
            <Field label="Status"><Select value={editPras.status} onChange={e => setEditPras({...editPras, status: e.target.value})}>
              <option>Ada</option><option>Tiada</option><option>Dalam Penambahbaikan</option>
            </Select></Field>
            <Field label="Catatan"><Textarea rows={2} value={editPras.catatan} onChange={e => setEditPras({...editPras, catatan: e.target.value})} /></Field>
            <div className="flex gap-2 justify-end">
              <Btn variant="white" onClick={() => setEditPras(null)}>Batal</Btn>
              <Btn variant="blue" onClick={() => savePras(editPras)}><Icon name="save" size={16} /> Simpan</Btn>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============================================================
   APP UTAMA
   ============================================================ */
function App() {
  const [activeTab, setActiveTab] = useState('tadbir');
  const [toast, setToast] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);

  const onToast = useCallback((t) => setToast(t), []);
  const closeToast = useCallback(() => setToast(null), []);

  return (
    <div className="min-h-screen bg-blue-50/30">
      <Header onSettings={() => setSettingsOpen(true)} />
      <TabNav active={activeTab} onChange={setActiveTab} />
      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        {activeTab === 'tadbir' && <TabTadbirUrus onToast={onToast} />}
        {activeTab === 'sumber' && <TabSumberManusia onToast={onToast} />}
        {activeTab === 'profil' && <TabProfilMBK onToast={onToast} />}
        {activeTab === 'prestasi' && <TabPrestasi onToast={onToast} />}
      </main>
      <footer className="max-w-7xl mx-auto px-4 sm:px-6 py-6 text-center text-xs text-slate-400">
        <p>Sistem Pengurusan JPKS SK Selama (K) &middot; Program Pendidikan Inklusif 2026 &middot; Pekeliling SPI Bil. 1/2026</p>
      </footer>
      <Toast toast={toast} onClose={closeToast} />
      <SettingsModal open={settingsOpen} onClose={() => setSettingsOpen(false)} onSave={() => { setSettingsOpen(false); onToast({ type: 'success', msg: 'URL API disimpan.' }); }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
