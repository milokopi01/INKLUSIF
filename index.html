/* ============================================================
   KONFIGURASI API
   ============================================================ */
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbyPLMeW9ZuGfqeGgCsKwH5WiuyjpM1-c9f9CI7Rw_hX9sR9-kVzHJINlfw5EQlI3s7nQA/exec';
const API_URL = localStorage.getItem('jpks_api_url') || DEFAULT_API_URL;

const SHEETS = {
  GURU: 'Guru',
  MURID: 'Murid',
  SARINGAN: 'Saringan',
  PRASARANA: 'Prasarana',
  CARTA: 'Carta_Organisasi',
};

async function apiGet(action, params = {}) {
  try {
    const url = new URL(API_URL);
    url.searchParams.set('action', action);
    Object.keys(params).forEach(k => { if (params[k] !== undefined) url.searchParams.set(k, params[k]); });
    const res = await fetch(url, { method: 'GET' });
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch { return { ok: false, error: 'Respon API tidak sah.' }; }
    return data;
  } catch (e) { return { ok: false, error: e.message }; }
}

async function apiPost(action, payload = {}) {
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, ...payload }),
    });
    const text = await res.text();
    let data; try { data = JSON.parse(text); } catch { return { ok: false, error: 'Respon API tidak sah.' }; }
    return data;
  } catch (e) { return { ok: false, error: e.message }; }
}

async function callGroqAI(prompt) {
  return await apiPost('callGroq', { prompt });
}

function Icon({ name, size = 18, className = '' }) {
  const ref = useRef(null);
  useEffect(() => {
    if (ref.current && window.lucide && window.lucide.createIcons) {
      ref.current.setAttribute('data-lucide', name);
      ref.current.innerHTML = '';
      window.lucide.createIcons({ attrs: { width: size, height: size }, nameAttr: 'data-lucide' });
    }
  }, [name, size]);
  return <span ref={ref} data-lucide={name} className={'inline-flex items-center ' + className} style={{ width: size, height: size }} />;
}

function generatePDF(element, filename, onToast, toastMsg) {
  if (!window.html2pdf) { onToast({ type: 'error', msg: 'Pustaka PDF tidak dimuatkan.' }); return; }
  const opt = { margin: 10, filename, image: { type: 'jpeg', quality: 0.98 }, html2canvas: { scale: 2, useCORS: true, logging: false }, jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } };
  window.html2pdf().set(opt).from(element).save();
  onToast({ type: 'success', msg: toastMsg || 'PDF dijana.' });
}
function formatDate(d) {
  if (!d) return '________________';
  try { return new Date(d).toLocaleDateString('ms-MY', { day: '2-digit', month: 'long', year: 'numeric' }); } catch { return d; }
}

/* ============================================================
   UNIVERSAL INLINE FILE UPLOADER (ke Google Drive)
   ============================================================ */
function FileUploader({ sectionId, onToast }) {
  const [files, setFiles] = useState([]);
  const [uploadedFiles, setUploadedFiles] = useState([]);
  const [dragOver, setDragOver] = useState(false);
  const [lightbox, setLightbox] = useState(null);
  const [uploading, setUploading] = useState(false);
  const inputRef = useRef(null);

  useEffect(() => {
    apiGet('listFiles').then(res => {
      if (res.ok && res.files) setUploadedFiles(res.files);
    });
  }, []);

  function handleFiles(fileList) {
    const arr = Array.from(fileList);
    let loaded = 0;
    arr.forEach(file => {
      if (file.size > 10 * 1024 * 1024) { onToast({ type: 'error', msg: file.name + ' melebihi 10MB.' }); return; }
      const reader = new FileReader();
      reader.onload = ev => {
        setFiles(prev => [...prev, { id: 'f' + Date.now() + Math.random().toString(36).slice(2), name: file.name, type: file.type, size: file.size, base64: ev.target.result, isImage: file.type.startsWith('image/') }]);
        loaded++;
        if (loaded === arr.length) onToast({ type: 'success', msg: arr.length + ' fail sedia untuk dimuat naik.' });
      };
      reader.readAsDataURL(file);
    });
  }

  async function uploadAll() {
    if (files.length === 0) { onToast({ type: 'error', msg: 'Tiada fail untuk dimuat naik.' }); return; }
    setUploading(true);
    let ok = 0;
    for (const f of files) {
      const base64 = f.base64.split(',')[1];
      const res = await apiPost('uploadToDrive', { fileName: f.name, fileData: base64, mimeType: f.type, tajukKecilId: sectionId });
      if (res.ok) ok++;
    }
    setUploading(false);
    setFiles([]);
    const res = await apiGet('listFiles');
    if (res.ok && res.files) setUploadedFiles(res.files);
    onToast({ type: 'success', msg: ok + ' fail berjaya dimuat naik ke Google Drive.' });
  }

  function deleteFile(id) { setFiles(files.filter(f => f.id !== id)); onToast({ type: 'success', msg: 'Fail dipadam dari senarai.' }); }
  function openFile(file) { const w = window.open(file.base64 || file.url, '_blank'); if (!w) onToast({ type: 'error', msg: 'Sekatan pop-up aktif.' }); }
  function getFileMeta(file) {
    const n = (file.name || '').toLowerCase();
    if (file.isImage || n.match(/\.(jpg|jpeg|png|gif|webp)$/)) return { icon: 'image', color: 'text-blue-600', bg: 'bg-blue-100', label: 'IMG' };
    if (n.endsWith('.pdf')) return { icon: 'file-text', color: 'text-rose-600', bg: 'bg-rose-100', label: 'PDF' };
    if (n.endsWith('.doc') || n.endsWith('.docx')) return { icon: 'file-text', color: 'text-blue-600', bg: 'bg-blue-100', label: 'DOC' };
    if (n.endsWith('.xls') || n.endsWith('.xlsx')) return { icon: 'file-spreadsheet', color: 'text-emerald-600', bg: 'bg-emerald-100', label: 'XLS' };
    if (n.endsWith('.ppt') || n.endsWith('.pptx')) return { icon: 'presentation', color: 'text-amber-600', bg: 'bg-amber-100', label: 'PPT' };
    return { icon: 'file', color: 'text-slate-600', bg: 'bg-slate-100', label: 'FILE' };
  }
  function fmtSize(b) { if (!b) return '-'; if (b < 1024) return b + ' B'; if (b < 1048576) return (b / 1024).toFixed(1) + ' KB'; return (b / 1048576).toFixed(1) + ' MB'; }

  return (
    <div className="mt-4 border-t border-slate-100 pt-4">
      <p className="text-sm font-semibold text-slate-600 mb-2 flex items-center gap-1.5"><Icon name="paperclip" size={15} /> Fail Lampiran (Google Drive)</p>
      <div className={`border-2 border-dashed rounded-xl p-4 text-center cursor-pointer transition-all ${dragOver ? 'border-blue-500 bg-blue-50' : 'border-slate-300 hover:border-blue-400 hover:bg-slate-50'}`} onClick={() => inputRef.current?.click()} onDragOver={e => { e.preventDefault(); setDragOver(true); }} onDragLeave={() => setDragOver(false)} onDrop={e => { e.preventDefault(); setDragOver(false); if (e.dataTransfer.files.length) handleFiles(e.dataTransfer.files); }}>
        <input ref={inputRef} type="file" multiple className="hidden" onChange={e => { if (e.target.files.length) handleFiles(e.target.files); e.target.value = ''; }} />
        <Icon name="upload-cloud" size={28} className="mx-auto mb-2 text-slate-400" />
        <p className="text-sm text-slate-500 font-medium">Seret fail ke sini atau klik untuk muat naik</p>
        <p className="text-xs text-slate-400 mt-1">Gambar, PDF, Word, Excel, PowerPoint (max 10MB)</p>
      </div>
      {files.length > 0 && (
        <>
          <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mt-4">
            {files.map(f => {
              const fm = getFileMeta(f);
              return (
                <div key={f.id} className="border border-slate-200 rounded-xl p-3 hover:shadow-md transition-shadow">
                  {f.isImage ? (
                    <div className="cursor-pointer" onClick={() => setLightbox(f)}><img src={f.base64} alt={f.name} className="w-full h-24 object-cover rounded-lg mb-2" /></div>
                  ) : (
                    <div className={`w-full h-24 ${fm.bg} rounded-lg mb-2 flex flex-col items-center justify-center`}><Icon name={fm.icon} size={28} className={fm.color} /><span className={`text-xs font-bold mt-1 ${fm.color}`}>{fm.label}</span></div>
                  )}
                  <p className="text-xs font-medium text-slate-700 truncate" title={f.name}>{f.name}</p>
                  <p className="text-xs text-slate-400">{fmtSize(f.size)}</p>
                  <button onClick={() => deleteFile(f.id)} className="w-full mt-2 text-xs py-1 rounded-lg bg-rose-50 text-rose-600 hover:bg-rose-100 font-medium flex items-center justify-center gap-1"><Icon name="trash-2" size={12} /> Buang</button>
                </div>
              );
            })}
          </div>
          <div className="flex justify-end mt-3">
            <Btn variant="green" onClick={uploadAll} disabled={uploading}><Icon name="upload" size={16} /> {uploading ? 'Memuat naik...' : 'Muat Naik ke Drive'}</Btn>
          </div>
        </>
      )}
      {uploadedFiles.length > 0 && (
        <div className="mt-4">
          <p className="text-xs font-semibold text-slate-500 mb-2">Fail di Google Drive:</p>
          <div className="space-y-1.5">
            {uploadedFiles.slice(0, 5).map((f, i) => (
              <div key={i} className="flex items-center gap-2 text-xs bg-slate-50 rounded-lg px-3 py-2">
                <Icon name="file" size={14} className="text-slate-400" />
                <span className="flex-1 truncate text-slate-700">{f.name}</span>
                <span className="text-slate-400">{fmtSize(f.size)}</span>
                <a href={f.url} target="_blank" rel="noreferrer" className="text-blue-600 hover:underline">Buka</a>
              </div>
            ))}
          </div>
        </div>
      )}
      {lightbox && (
        <div className="fixed inset-0 z-[70] flex items-center justify-center p-4 bg-slate-900/70 backdrop-blur-sm" onClick={() => setLightbox(null)}>
          <div className="relative max-w-4xl max-h-[90vh]" onClick={e => e.stopPropagation()}>
            <button onClick={() => setLightbox(null)} className="absolute -top-3 -right-3 w-8 h-8 bg-white rounded-full shadow-lg flex items-center justify-center text-slate-600 hover:text-slate-900 z-10"><Icon name="x" size={18} /></button>
            <img src={lightbox.base64} alt={lightbox.name} className="max-w-full max-h-[85vh] rounded-xl shadow-2xl" />
            <p className="text-white text-sm text-center mt-2">{lightbox.name}</p>
          </div>
        </div>
      )}
    </div>
  );
}

function TabSumberManusia({ onToast }) {
  const [teachers, setTeachers] = useState(DEFAULT_TEACHERS);
  const [editing, setEditing] = useState(null);
  const [schedule, setSchedule] = useState(DEFAULT_SCHEDULE);
  const [editSlot, setEditSlot] = useState(null);
  const [loading, setLoading] = useState(true);
  const scheduleRef = useRef(null);
  const ldpRef = useRef(null);
  const [ldp, setLdp] = useState({ nama: '', tarikh: '', tajuk: '', pencerap: '', objektif: '', catatan: '', tindakan: '' });

  useEffect(() => {
    apiGet('list', { sheet: SHEETS.GURU }).then(res => {
      if (res.ok && res.data && res.data.length > 0) setTeachers(res.data);
      setLoading(false);
    }).catch(() => setLoading(false));
  }, []);

  async function saveTeacher(t) {
    if (t.id) {
      const res = await apiPost('update', { sheet: SHEETS.GURU, id: t.id, record: t });
      if (res.ok) { setTeachers(teachers.map(x => x.id === t.id ? t : x)); onToast({ type: 'success', msg: 'Profil guru dikemas kini.' }); }
      else onToast({ type: 'error', msg: res.error || 'Gagal menyimpan.' });
    } else {
      const newId = 'g' + Date.now();
      const rec = { ...t, id: newId };
      const res = await apiPost('create', { sheet: SHEETS.GURU, record: rec });
      if (res.ok) { setTeachers([...teachers, rec]); onToast({ type: 'success', msg: 'Profil guru baharu ditambah.' }); }
      else onToast({ type: 'error', msg: res.error || 'Gagal menambah.' });
    }
    setEditing(null);
  }
  async function deleteTeacher(id) {
    const res = await apiPost('delete', { sheet: SHEETS.GURU, id });
    if (res.ok) { setTeachers(teachers.filter(t => t.id !== id)); onToast({ type: 'success', msg: 'Profil guru dipadam.' }); }
    else onToast({ type: 'error', msg: res.error || 'Gagal memadam.' });
  }
  function saveSlot(day, time, value) {
    setSchedule(prev => ({ ...prev, [day]: { ...prev[day], [time]: value } }));
    setEditSlot(null);
    onToast({ type: 'success', msg: `Slot ${day} ${time} dikemas kini.` });
  }

  return (
    <div className="space-y-6 fade-in">
      <Card className="p-6">
        <div className="flex items-center justify-between mb-4">
          <SectionTitle icon="users" title="Profil Guru PPKI" desc="Senarai guru Program Pendidikan Khas Integrasi" />
          <Btn variant="blue" onClick={() => setEditing({ id: '', nama: '', gred: '', opsyen: '', subjek: '' })}><Icon name="plus" size={16} /> Tambah Guru</Btn>
        </div>
        {loading ? <Loading msg="Memuatkan data guru..." /> : (
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead>
                <tr className="border-b border-slate-200 text-left text-slate-500">
                  <th className="py-3 px-4 font-semibold">Nama</th>
                  <th className="py-3 px-4 font-semibold">Gred</th>
                  <th className="py-3 px-4 font-semibold">Opsyen</th>
                  <th className="py-3 px-4 font-semibold">Subjek</th>
                  <th className="py-3 px-4 font-semibold text-right">Tindakan</th>
                </tr>
              </thead>
              <tbody>
                {teachers.map(t => (
                  <tr key={t.id} className="border-b border-slate-100 hover:bg-slate-50/50 transition-colors">
                    <td className="py-3 px-4 font-semibold text-slate-900">{t.nama}</td>
                    <td className="py-3 px-4"><Badge color="blue">{t.gred}</Badge></td>
                    <td className="py-3 px-4 text-slate-600">{t.opsyen}</td>
                    <td className="py-3 px-4 text-slate-600">{t.subjek}</td>
                    <td className="py-3 px-4">
                      <div className="flex gap-2 justify-end">
                        <button onClick={() => setEditing({...t})} className="p-2 rounded-lg hover:bg-blue-50 text-blue-600"><Icon name="pencil" size={16} /></button>
                        <button onClick={() => deleteTeacher(t.id)} className="p-2 rounded-lg hover:bg-rose-50 text-rose-600"><Icon name="trash-2" size={16} /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>

function SaringanSSKI({ onToast, students }) {
  const [selectedStudent, setSelectedStudent] = useState('');
  const [responses, setResponses] = useState({});
  const [showBorang, setShowBorang] = useState(null);
  const borangRef = useRef(null);
  const [borangData, setBorangData] = useState({ namaIbuBapa: '', kadPengenalan: '', alamat: '', tarikh: '', tandaTangan: '' });
  const [rpiItems, setRpiItems] = useState([]);

  const allItems = useMemo(() => SSKI_IS_ITEMS.flatMap(d => d.items.map(i => ({ ...i, domain: d.domain }))), []);
  const yaCount = useMemo(() => allItems.filter(i => responses[i.code] === 'YA').length, [responses, allItems]);
  const answeredCount = useMemo(() => allItems.filter(i => responses[i.code]).length, [responses, allItems]);
  const percentage = useMemo(() => Math.round((yaCount / 25) * 100), [yaCount]);
  const isComplete = answeredCount === 25;

  const qualification = useMemo(() => {
    if (!isComplete) return null;
    if (percentage >= 70) return { label: 'Layak Inklusif Akademik', color: 'green', desc: 'Murid layak mengikuti program inklusif separa untuk subjek akademik di kelas arus perdana.', borang: 'akuan' };
    if (percentage >= 50) return { label: 'Layak Inklusif Bukan Akademik', color: 'amber', desc: 'Murid layak inklusif separa untuk subjek bukan akademik dengan sokongan rakan pendamping.', borang: null };
    return { label: 'Belum Bersedia (Kekal di PPKI)', color: 'rose', desc: 'Murid belum bersedia untuk inklusif. Kekal di program PPKI untuk intervensen lanjutan.', borang: 'rpi' };
  }, [percentage, isComplete]);

  function setResponse(code, val) { setResponses(prev => ({ ...prev, [code]: val })); setShowBorang(null); }
  function resetSaringan() { setResponses({}); setShowBorang(null); setBorangData({ namaIbuBapa: '', kadPengenalan: '', alamat: '', tarikh: '', tandaTangan: '' }); setRpiItems([]); }
  function generateBorang() {
    if (qualification?.borang === 'rpi') { setRpiItems(allItems.filter(i => responses[i.code] === 'TIDAK')); }
    setShowBorang(qualification.borang);
  }
  function saveBorangPDF() {
    const studentName = students.find(s => s.id === selectedStudent)?.nama || 'Murid';
    if (showBorang === 'akuan') generatePDF(borangRef.current, `Borang_Akuan_Persetujuan_Ibu_Bapa_${studentName.replace(/\s/g,'_')}.pdf`, onToast, 'PDF Borang Akuan Persetujuan dijana.');
    else generatePDF(borangRef.current, `Borang_RPI_${studentName.replace(/\s/g,'_')}.pdf`, onToast, 'PDF Borang RPI dijana.');
  }
  const student = students.find(s => s.id === selectedStudent);

  return (
    <Card className="p-6">
      <SectionTitle icon="clipboard-check" title="Instrumen Saringan Kesediaan Inklusif Separa (SSKI-IS)" desc="25 item rasmi Buku Panduan PPKI KPM — 5 Domain Utama" />
      <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <Field label="Pilih Murid untuk Saringan">
          <Select value={selectedStudent} onChange={e => { setSelectedStudent(e.target.value); resetSaringan(); }}>
            <option value="">-- Pilih Murid --</option>
            {students.map(s => <option key={s.id} value={s.id}>{s.nama}</option>)}
          </Select>
        </Field>
        <div className="md:col-span-2 flex items-end gap-3">
          {student && <div className="text-sm text-slate-600 bg-slate-50 rounded-xl px-4 py-2 flex-1"><span className="font-semibold">Murid:</span> {student.nama} | <span className="font-semibold">Kelas:</span> {student.kelas} | <span className="font-semibold">Diagnosis:</span> {student.diagnosis}</div>}
        </div>
      </div>

      {selectedStudent && (
        <>
          <div className="mb-6">
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-sm font-semibold text-slate-600">Kemajuan Saringan: {answeredCount}/25 item</span>
              {isComplete && <span className="text-sm font-bold text-blue-700">Selesai!</span>}
            </div>
            <div className="w-full h-2.5 bg-slate-200 rounded-full overflow-hidden">
              <div className="h-full bg-blue-600 rounded-full transition-all duration-300" style={{ width: `${(answeredCount / 25) * 100}%` }} />
            </div>
          </div>

          <div className="space-y-5">
            {SSKI_IS_ITEMS.map((dom, di) => (
              <div key={di} className="border border-slate-200 rounded-2xl overflow-hidden">
                <div className="bg-slate-50 px-4 py-3 flex items-center gap-2 border-b border-slate-200">
                  <Icon name={dom.icon} size={18} className="text-blue-600" />
                  <h4 className="font-bold text-slate-800 text-sm">{dom.domain}</h4>
                  <span className="ml-auto text-xs text-slate-400">5 item</span>
                </div>
                <div className="divide-y divide-slate-100">
                  {dom.items.map((item, ii) => {
                    const val = responses[item.code];
                    return (
                      <div key={ii} className="flex items-center gap-3 px-4 py-3 hover:bg-slate-50/50 transition-colors">
                        <div className="flex-shrink-0 w-12"><Badge color="slate">{item.code}</Badge></div>
                        <p className="flex-1 text-sm text-slate-700">{item.text}</p>
                        <div className="flex gap-1.5 flex-shrink-0">
                          <button onClick={() => setResponse(item.code, 'YA')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border-b-2 active:border-b-0 active:translate-y-0.5 ${val === 'YA' ? 'bg-emerald-600 text-white border-emerald-800' : 'bg-white text-slate-500 border-slate-300 hover:bg-emerald-50'}`}>YA</button>
                          <button onClick={() => setResponse(item.code, 'TIDAK')}
                            className={`px-3 py-1.5 rounded-lg text-xs font-bold transition-all border-b-2 active:border-b-0 active:translate-y-0.5 ${val === 'TIDAK' ? 'bg-rose-600 text-white border-rose-800' : 'bg-white text-slate-500 border-slate-300 hover:bg-rose-50'}`}>TIDAK</button>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ))}
          </div>

          {isComplete && (
            <div className="mt-6 slide-up">
              <div className={`rounded-2xl border-2 p-5 ${qualification.color === 'green' ? 'border-emerald-200 bg-emerald-50' : qualification.color === 'amber' ? 'border-amber-200 bg-amber-50' : 'border-rose-200 bg-rose-50'}`}>
                <div className="flex items-center justify-between flex-wrap gap-3">
                  <div>
                    <p className="text-sm font-semibold text-slate-600 mb-1">Keputusan Saringan SSKI-IS</p>
                    <div className="flex items-center gap-3">
                      <span className={`text-3xl font-extrabold ${qualification.color === 'green' ? 'text-emerald-700' : qualification.color === 'amber' ? 'text-amber-700' : 'text-rose-700'}`}>{percentage}%</span>
                      <span className="text-sm text-slate-500">({yaCount} YA / {25 - yaCount} TIDAK)</span>
                    </div>
                  </div>
                  <div className="text-right">
                    <Badge color={qualification.color}>{qualification.label}</Badge>
                    <p className="text-xs text-slate-500 mt-1 max-w-xs">{qualification.desc}</p>
                  </div>
                </div>
                <div className="flex gap-2 mt-4 flex-wrap">
                  <Btn variant="white" onClick={resetSaringan}><Icon name="rotate-ccw" size={16} /> Reset Saringan</Btn>
                  {qualification.borang && (
                    <Btn variant="green" onClick={generateBorang}>
                      <Icon name="file-text" size={16} />
                      {qualification.borang === 'akuan' ? 'Buka Borang Akuan Persetujuan Ibu Bapa' : 'Buka Borang Cadangan RPI'}
                    </Btn>
                  )}
                </div>
              </div>
            </div>
          )}

          {showBorang === 'akuan' && (
            <div className="mt-6 slide-up">
              <div className="flex items-center gap-2 mb-3"><Icon name="file-signature" size={18} className="text-emerald-600" /><h4 className="font-bold text-slate-800">Borang Akuan Persetujuan Ibu Bapa / Penjaga</h4></div>
              <p className="text-xs text-slate-500 mb-4">Lampiran Buku Panduan PPKI KPM 2015 — Sila lengkapkan maklumat dan simpan sebagai PDF.</p>
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <Field label="Nama Ibu Bapa / Penjaga"><Input value={borangData.namaIbuBapa} onChange={e => setBorangData({...borangData, namaIbuBapa: e.target.value})} /></Field>
                <Field label="No. Kad Pengenalan"><Input value={borangData.kadPengenalan} onChange={e => setBorangData({...borangData, kadPengenalan: e.target.value})} /></Field>
                <Field label="Alamat"><Input value={borangData.alamat} onChange={e => setBorangData({...borangData, alamat: e.target.value})} /></Field>
                <Field label="Tarikh"><Input type="date" value={borangData.tarikh} onChange={e => setBorangData({...borangData, tarikh: e.target.value})} /></Field>
              </div>
              <div className="flex justify-end mb-4"><Btn variant="green" onClick={saveBorangPDF}><Icon name="download" size={16} /> Simpan PDF</Btn></div>
              <div ref={borangRef} className="bg-white border border-slate-200 rounded-xl p-8" style={{ fontFamily: 'Arial, Helvetica, sans-serif', color: '#000' }}>

function TabProfilMBK({ onToast }) {
  const [students, setStudents] = useState(DEFAULT_STUDENTS);
  const [editing, setEditing] = useState(null);
  const [loading, setLoading] = useState(true);
  const [aiInput, setAiInput] = useState('');
  const [aiResult, setAiResult] = useState(null);
  const [aiLoading, setAiLoading] = useState(false);

  useEffect(() => {
    apiGet('list', { sheet: SHEETS.MURID }).then(res => {
      if (res.ok && res.data && res.data.length > 0) setStudents(res.data);
      setLoading(false);
    }).catch(() => setLoading(false));
  }, []);

  async function saveStudent(s) {
    if (s.id) {
      const res = await apiPost('update', { sheet: SHEETS.MURID, id: s.id, record: s });
      if (res.ok) { setStudents(students.map(x => x.id === s.id ? s : x)); onToast({ type: 'success', msg: 'Profil murid dikemas kini.' }); }
      else onToast({ type: 'error', msg: res.error || 'Gagal menyimpan.' });
    } else {
      const newId = 'm' + Date.now();
      const rec = { ...s, id: newId };
      const res = await apiPost('create', { sheet: SHEETS.MURID, record: rec });
      if (res.ok) { setStudents([...students, rec]); onToast({ type: 'success', msg: 'Profil murid baharu ditambah.' }); }
      else onToast({ type: 'error', msg: res.error || 'Gagal menambah.' });
    }
    setEditing(null);
  }
  async function deleteStudent(id) {
    const res = await apiPost('delete', { sheet: SHEETS.MURID, id });
    if (res.ok) { setStudents(students.filter(s => s.id !== id)); onToast({ type: 'success', msg: 'Profil murid dipadam.' }); }
    else onToast({ type: 'error', msg: res.error || 'Gagal memadam.' });
  }
  function getMarkahColor(m) { if (m >= 80) return 'green'; if (m >= 60) return 'blue'; if (m >= 40) return 'amber'; return 'rose'; }

  async function runAI() {
    if (!aiInput.trim()) { onToast({ type: 'error', msg: 'Sila masukkan soalan atau data murid.' }); return; }
    setAiLoading(true);
    setAiResult(null);
    const res = await callGroqAI(aiInput);
    if (res.ok) {
      setAiResult(res.result);
      onToast({ type: 'success', msg: 'Minda AI berjaya menganalisis.' });
    } else {
      onToast({ type: 'error', msg: res.error || 'Minda AI gagal. Pastikan API Key Groq telah ditambah dalam tab apikey.' });
    }
    setAiLoading(false);
  }

  return (
    <div className="space-y-6 fade-in">
      <Card className="p-6">
        <div className="flex items-center justify-between mb-4">
          <SectionTitle icon="database" title="Pangkalan Data Murid Inklusif" desc="Profil murid PPKI dengan saringan dan status penempatan" />
          <Btn variant="blue" onClick={() => setEditing({ id: '', nama: '', mykid: '', oku: '', diagnosis: '', kelas: '', jenis: 'Inklusif Separa', guru_mentor: '', markah_saringan: 0, status: '' })}><Icon name="plus" size={16} /> Tambah Murid</Btn>
        </div>
        {loading ? <Loading msg="Memuatkan data murid..." /> : (
          <div className="space-y-4">
            {students.map(s => (
              <div key={s.id} className="border border-slate-200 rounded-2xl p-4 hover:shadow-md transition-shadow">
                <div className="flex flex-wrap items-start justify-between gap-3">
                  <div className="flex-1 min-w-[200px]">
                    <div className="flex items-center gap-2 mb-2">
                      <h4 className="font-bold text-slate-900">{s.nama}</h4>
                      <Badge color={getMarkahColor(s.markah_saringan)}>Saringan: {s.markah_saringan}</Badge>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-3 gap-x-4 gap-y-1 text-sm">
                      <p className="text-slate-500">MyKid: <span className="font-medium text-slate-700">{s.mykid}</span></p>
                      <p className="text-slate-500">OKU: <span className="font-medium text-slate-700">{s.oku}</span></p>
                      <p className="text-slate-500">Diagnosis: <span className="font-medium text-slate-700">{s.diagnosis}</span></p>
                      <p className="text-slate-500">Kelas: <span className="font-medium text-slate-700">{s.kelas}</span></p>
                      <p className="text-slate-500">Jenis: <span className="font-medium text-slate-700">{s.jenis}</span></p>
                      <p className="text-slate-500">Mentor: <span className="font-medium text-slate-700">{s.guru_mentor}</span></p>
                    </div>
                    <div className="mt-2"><Badge color={s.status && s.status.includes('Akademik') ? 'green' : 'amber'}>{s.status}</Badge></div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => setEditing({...s})} className="p-2 rounded-lg hover:bg-blue-50 text-blue-600"><Icon name="pencil" size={16} /></button>
                    <button onClick={() => deleteStudent(s.id)} className="p-2 rounded-lg hover:bg-rose-50 text-rose-600"><Icon name="trash-2" size={16} /></button>
                  </div>
                </div>
              </div>
            ))}
          </div>
        )}
        <FileUploader sectionId="profil_pangkalan_murid" onToast={onToast} />
      </Card>

      <Card className="p-6">
        <SectionTitle icon="brain" title="Minda AI — Analisis Intervensi Inklusif" desc="Panggilan AI Groq (llama-3.3-70b) melalui proxy dengan auto-rotasi API Key" />
        <div className="space-y-4">
          <div className="flex gap-2">
            <Input value={aiInput} onChange={e => setAiInput(e.target.value)} placeholder="Cth: Cadangan intervensi untuk murid Slow Learner di kelas 1 Bestari" onKeyDown={e => e.key === 'Enter' && runAI()} />
            <Btn variant="blue" onClick={runAI} disabled={aiLoading}><Icon name="sparkles" size={16} /> {aiLoading ? 'Menganalisis...' : 'Analisis'}</Btn>
          </div>
          {aiLoading && <Loading msg="Minda AI sedang menganalisis melalui proxy Groq..." />}
          {aiResult && !aiLoading && (
            <div className="bg-blue-50/50 border border-blue-100 rounded-xl p-5 slide-up">
              <div className="flex items-center gap-2 mb-3">
                <Icon name="sparkles" size={16} className="text-blue-600" />
                <span className="text-sm font-bold text-blue-700">Jawapan Minda AI:</span>
              </div>
              <pre className="text-sm text-slate-700 whitespace-pre-wrap font-sans leading-relaxed">{aiResult}</pre>
            </div>
          )}
          {!aiResult && !aiLoading && (
            <div className="bg-slate-50 border border-slate-200 rounded-xl p-4 text-sm text-slate-500">
              <p className="font-semibold text-slate-700 mb-1">Contoh soalan:</p>
              <ul className="list-disc pl-5 space-y-1">
                <li>"Cadangan intervensi untuk murid Slow Learner di kelas 1 Bestari"</li>
                <li>"Beri strategi PdP untuk murid Autisme Ringan dalam kelas arus perdana"</li>
                <li>"Bina IEP untuk murid Masalah Pendengaran yang mengikuti subjek akademik"</li>
              </ul>
              <p className="mt-2 text-xs text-slate-400">AI menggunakan model llama-3.3-70b-versatile melalui proxy Google Apps Script dengan auto-rotasi API Key.</p>
            </div>
          )}
        </div>
        <FileUploader sectionId="profil_minda_ai" onToast={onToast} />
      </Card>

      <SaringanSSKI onToast={onToast} students={students} />

      <Modal open={!!editing} onClose={() => setEditing(null)} title={editing?.id ? 'Edit Profil Murid' : 'Tambah Murid Inklusif'} wide>
        {editing && (
          <div className="space-y-4">
            <Field label="Nama Murid"><Input value={editing.nama} onChange={e => setEditing({...editing, nama: e.target.value})} /></Field>
            <div className="grid grid-cols-2 gap-3">
              <Field label="No. MyKid"><Input value={editing.mykid} onChange={e => setEditing({...editing, mykid: e.target.value})} /></Field>
              <Field label="No. OKU"><Input value={editing.oku} onChange={e => setEditing({...editing, oku: e.target.value})} /></Field>
              <Field label="Diagnosis"><Input value={editing.diagnosis} onChange={e => setEditing({...editing, diagnosis: e.target.value})} /></Field>
              <Field label="Kelas"><Input value={editing.kelas} onChange={e => setEditing({...editing, kelas: e.target.value})} /></Field>
              <Field label="Jenis Inklusif"><Select value={editing.jenis} onChange={e => setEditing({...editing, jenis: e.target.value})}>
                <option>Inklusif Separa</option><option>Inklusif Penuh</option>
              </Select></Field>
              <Field label="Guru Mentor"><Input value={editing.guru_mentor} onChange={e => setEditing({...editing, guru_mentor: e.target.value})} /></Field>
              <Field label="Markah Saringan"><Input type="number" value={editing.markah_saringan} onChange={e => setEditing({...editing, markah_saringan: parseInt(e.target.value) || 0})} /></Field>
              <Field label="Status"><Input value={editing.status} onChange={e => setEditing({...editing, status: e.target.value})} /></Field>
            </div>
            <div className="flex gap-2 justify-end">
              <Btn variant="white" onClick={() => setEditing(null)}>Batal</Btn>
              <Btn variant="blue" onClick={() => saveStudent(editing)}><Icon name="save" size={16} /> Simpan</Btn>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

          <div className="bg-amber-50 border border-amber-200 rounded-xl p-4">
            <div className="flex items-center gap-2 mb-2"><Icon name="alert-triangle" size={18} className="text-amber-600" /><h4 className="font-bold text-amber-800">Ancaman (Threats)</h4></div>
            <Textarea rows={4} value={swot.ancaman} onChange={e => setSwot({...swot, ancaman: e.target.value})} placeholder="Cth: Pemindahan guru, kekurangan dana, perubahan dasar..." />
          </div>
        </div>
        <div className="flex justify-end mt-4 gap-2">
          <Btn variant="blue" onClick={() => onToast({ type: 'success', msg: 'Analisis SWOT disimpan.' })}><Icon name="save" size={16} /> Simpan SWOT</Btn>
          <Btn variant="green" onClick={() => generatePDF(swotRef.current, `Analisis_SWOT_PPI_${swot.tahun}.pdf`, onToast, 'PDF analisis SWOT dijana.')}><Icon name="download" size={16} /> Simpan PDF</Btn>
        </div>
        <div ref={swotRef} className="bg-white border border-slate-200 rounded-xl p-8 mt-4" style={{ fontFamily: 'Arial, Helvetica, sans-serif', color: '#000' }}>
          <PrintLetterhead sekolah="SK SELAMA (K)" />
          <h3 style={{ textAlign: 'center', fontWeight: 'bold', textDecoration: 'underline', fontSize: '14px', margin: '0 0 16px' }}>ANALISIS SWOT TAHUNAN PROGRAM PENDIDIKAN INKLUSIF {swot.tahun}</h3>
          <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '11px' }}><tbody>
            <tr>
              <td style={{ border: '1px solid #000', padding: '8px', fontWeight: 'bold', background: '#d4edda', width: '50%', textAlign: 'center' }}>KEKUATAN (STRENGTHS)</td>
              <td style={{ border: '1px solid #000', padding: '8px', fontWeight: 'bold', background: '#f8d7da', width: '50%', textAlign: 'center' }}>KELEMAHAN (WEAKNESSES)</td>
            </tr>
            <tr>
              <td style={{ border: '1px solid #000', padding: '8px', verticalAlign: 'top' }}><pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'Arial, Helvetica, sans-serif' }}>{swot.kekuatan || '________________'}</pre></td>
              <td style={{ border: '1px solid #000', padding: '8px', verticalAlign: 'top' }}><pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'Arial, Helvetica, sans-serif' }}>{swot.kelemahan || '________________'}</pre></td>
            </tr>
            <tr>
              <td style={{ border: '1px solid #000', padding: '8px', fontWeight: 'bold', background: '#d1ecf1', textAlign: 'center' }}>PELUANG (OPPORTUNITIES)</td>
              <td style={{ border: '1px solid #000', padding: '8px', fontWeight: 'bold', background: '#fff3cd', textAlign: 'center' }}>ANCAMAN (THREATS)</td>
            </tr>
            <tr>
              <td style={{ border: '1px solid #000', padding: '8px', verticalAlign: 'top' }}><pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'Arial, Helvetica, sans-serif' }}>{swot.peluang || '________________'}</pre></td>
              <td style={{ border: '1px solid #000', padding: '8px', verticalAlign: 'top' }}><pre style={{ whiteSpace: 'pre-wrap', margin: 0, fontFamily: 'Arial, Helvetica, sans-serif' }}>{swot.ancaman || '________________'}</pre></td>
            </tr>
          </tbody></table>
          <PrintSignature name="Tn. Hj. Abdul Rahman bin Hassan" title="Guru Besar / Pengerusi JPKS" />
        </div>
        <FileUploader sectionId="prestasi_swot" onToast={onToast} />
      </Card>

      <Modal open={!!editPras} onClose={() => setEditPras(null)} title={editPras?.id ? 'Edit Item Prasarana' : 'Tambah Item Prasarana'}>
        {editPras && (
          <div className="space-y-4">
            <Field label="Item"><Input value={editPras.item} onChange={e => setEditPras({...editPras, item: e.target.value})} /></Field>
            <Field label="Lokasi"><Input value={editPras.lokasi} onChange={e => setEditPras({...editPras, lokasi: e.target.value})} /></Field>
            <Field label="Status"><Select value={editPras.status} onChange={e => setEditPras({...editPras, status: e.target.value})}>
              <option>Ada</option><option>Tiada</option><option>Dalam Penambahbaikan</option>
            </Select></Field>
            <Field label="Catatan"><Textarea rows={2} value={editPras.catatan} onChange={e => setEditPras({...editPras, catatan: e.target.value})} /></Field>
            <div className="flex gap-2 justify-end">
              <Btn variant="white" onClick={() => setEditPras(null)}>Batal</Btn>
              <Btn variant="blue" onClick={() => savePras(editPras)}><Icon name="save" size={16} /> Simpan</Btn>
            </div>
          </div>
        )}
      </Modal>
    </div>
  );
}

/* ============================================================
   APP UTAMA
   ============================================================ */
function App() {
  const [activeTab, setActiveTab] = useState('tadbir');
  const [toast, setToast] = useState(null);
  const [settingsOpen, setSettingsOpen] = useState(false);

  const onToast = useCallback((t) => setToast(t), []);
  const closeToast = useCallback(() => setToast(null), []);

  useEffect(() => {
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  }, []);

  return (
    <div className="min-h-screen bg-blue-50/30">
      <Header onSettings={() => setSettingsOpen(true)} />
      <TabNav active={activeTab} onChange={setActiveTab} />
      <main className="max-w-7xl mx-auto px-4 sm:px-6 py-6">
        {activeTab === 'tadbir' && <TabTadbirUrus onToast={onToast} />}
        {activeTab === 'sumber' && <TabSumberManusia onToast={onToast} />}
        {activeTab === 'profil' && <TabProfilMBK onToast={onToast} />}
        {activeTab === 'prestasi' && <TabPrestasi onToast={onToast} />}
      </main>
      <footer className="max-w-7xl mx-auto px-4 sm:px-6 py-6 text-center text-xs text-slate-400">
        <p>Sistem Pengurusan JPKS SK Selama (K) &middot; Program Pendidikan Inklusif 2026 &middot; Pekeliling SPI Bil. 1/2026</p>
      </footer>
      <Toast toast={toast} onClose={closeToast} />
      <SettingsModal open={settingsOpen} onClose={() => setSettingsOpen(false)} onSave={() => { setSettingsOpen(false); onToast({ type: 'success', msg: 'URL API disimpan.' }); }} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
