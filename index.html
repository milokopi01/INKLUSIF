    // ============================================================

    function Icon({ name, size = 18, className = '' }) {
      const ref = useRef(null);
      useEffect(() => {
        if (ref.current) {
          ref.current.innerHTML = '';
          try {
            const iconName = name.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join('');
            const iconData = (window.lucide && window.lucide.icons && window.lucide.icons[iconName]) || (window.lucide && window.lucide.icons && window.lucide.icons.Square);
            if (iconData) {
              const svg = iconData.toSvg ? iconData.toSvg({ width: size, height: size }) : '';
              ref.current.innerHTML = svg;
            }
          } catch (e) {}
        }
      }, [name, size, className]);
      return React.createElement('span', { ref, className: 'inline-flex items-center justify-center ' + className, style: { width: size, height: size } });
    }

    // ============================================================
    // FUNGSI JANA PDF
    // ============================================================
    function generatePDF(elementId, filename) {
      const el = document.getElementById(elementId);
      if (!el) { alert('Elemen PDF tidak dijumpai!'); return Promise.resolve(); }
      const opt = {
        margin: 10,
        filename: filename,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
      };
      el.style.display = 'block';
      return html2pdf().set(opt).from(el).save().then(() => {
        el.style.display = 'none';
      }).catch(err => {
        el.style.display = 'none';
        alert('Ralat penjanaan PDF: ' + err.message);
      });
    }

    // ============================================================
    // HOOK: GUNA DATA DARI APPS SCRIPT ATAU FALLBACK
    // ============================================================
    function useBackendData() {
      const [murid, setMurid] = useState(() => {
        try { return JSON.parse(localStorage.getItem('spib_murid') || 'null') || FALLBACK_MURID; }
        catch { return FALLBACK_MURID; }
      });
      const [guru, setGuru] = useState(() => {
        try { return JSON.parse(localStorage.getItem('spib_guru') || 'null') || FALLBACK_GURU; }
        catch { return FALLBACK_GURU; }
      });
      const [prasarana, setPrasarana] = useState(() => {
        try { return JSON.parse(localStorage.getItem('spib_prasarana') || 'null') || FALLBACK_PRASARANA; }
        catch { return FALLBACK_PRASARANA; }
      });
      const [loading, setLoading] = useState(false);
      const settings = getSettings();

      const fetchFromServer = useCallback(async () => {
        if (!settings.webAppUrl) return;
        setLoading(true);
        try {
          const res = await fetch(settings.webAppUrl + '?action=readAll');
          const json = await res.json();
          if (json.success && json.data) {
            if (json.data.murid && json.data.murid.length) { setMurid(json.data.murid); localStorage.setItem('spib_murid', JSON.stringify(json.data.murid)); }
            if (json.data.guru && json.data.guru.length) { setGuru(json.data.guru); localStorage.setItem('spib_guru', JSON.stringify(json.data.guru)); }
            if (json.data.prasarana && json.data.prasarana.length) { setPrasarana(json.data.prasarana); localStorage.setItem('spib_prasarana', JSON.stringify(json.data.prasarana)); }
          }
        } catch (e) { /* senyap - guna fallback */ }
        finally { setLoading(false); }
      }, [settings.webAppUrl]);

      useEffect(() => { fetchFromServer(); }, [fetchFromServer]);

      const saveToServer = useCallback(async (action, record) => {
        if (!settings.webAppUrl) {
          return { success: true, message: 'Disimpan secara setempat (mod sandaran)' };
        }
        try {
          const res = await fetch(settings.webAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'data=' + encodeURIComponent(JSON.stringify({ action, record }))
          });
          return await res.json();
        } catch (e) {
          return { success: false, error: e.message };
        }
      }, [settings.webAppUrl]);

      const deleteFromServer = useCallback(async (action, id) => {
        if (!settings.webAppUrl) {
          return { success: true, message: 'Dipadam secara setempat (mod sandaran)' };
        }
        try {
          const res = await fetch(settings.webAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'data=' + encodeURIComponent(JSON.stringify({ action, id }))
          });
          return await res.json();
        } catch (e) {
          return { success: false, error: e.message };
        }
      }, [settings.webAppUrl]);

      const uploadFile = useCallback(async (base64, fileName) => {
        if (!settings.webAppUrl) {
          return { success: false, error: 'URL Web App Apps Script belum ditetapkan. Sila tetapkan di Papan Tetapan Utama.' };
        }
        try {
          const res = await fetch(settings.webAppUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'data=' + encodeURIComponent(JSON.stringify({
              action: 'uploadToDrive',
              base64: base64,
              fileName: fileName,
              folderId: settings.driveFolderId || ''
            }))
          });
          return await res.json();
        } catch (e) {
          return { success: false, error: e.message };
        }
      }, [settings.webAppUrl]);

      return { murid, setMurid, guru, setGuru, prasarana, setPrasarana, loading, fetchFromServer, saveToServer, deleteFromServer, uploadFile };
    }

      const [showForm, setShowForm] = useState(false);

          newMurid = murid.map(m => m.id === rec.id ? rec : m);
        } else {
          const newId = 'M' + String(murid.length + 1).padStart(2, '0');
          rec.id = newId;
          newMurid = [...murid, rec];
        }
        setMurid(newMurid);
        localStorage.setItem('spib_murid', JSON.stringify(newMurid));
        const res = await saveToServer('saveMurid', rec);
        showToast(res.message || 'Rekod disimpan', res.success === false ? 'error' : 'success');
        setShowForm(false);
        setEditRec(null);
      };

      const handleDelete = async (id) => {
        if (!confirm('Padam rekod murid ini? Tindakan ini tidak boleh dibuat asal.')) return;
        const newMurid = murid.filter(m => m.id !== id);

        const res = await deleteFromServer('deleteMurid', id);

      };

      const runAI = async (m) => {
        const settings = getSettings();
        if (!settings.groqApiKey) {
          showToast('Sila tetapkan Groq API Key di Papan Tetapan Utama.', 'error');
          return;
        }
        setAiLoading(true);
        setAiModal({ murid: m, laporan: '', loading: true });
        try {
          const failedItems = (saringanMurid && saringanMurid.id === m.id) ? (saringanMurid.failedItems || []) : [];
          const prompt = `Analisis data saringan murid berikut dan hasilkan Laporan Diagnostik profesional dalam Bahasa Melayu.\n\nNama: ${m.nama}\nDiagnosis: ${m.diagnosis}\nSkor Saringan SSKI-IS: ${m.skorSaringan}%\nItem yang gagal dikuasai (jawapan Tidak): ${failedItems.length ? failedItems.join(', ') : 'Tiada data item terperinci'}\n\nLaporan mesti mengandungi: (1) Ulasan Tahap Kesediaan, (2) Analisis Kelemahan Spesifik Domain, (3) 3 Pelan Tindakan RPI Berfokus, dan (4) Cadangan Pedagogi Terbeza di Kelas Biasa. Tulis dalam format Markdown yang sangat kemas.`;

          const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + settings.groqApiKey
            },
            body: JSON.stringify({
              model: 'llama-3.3-70b-versatile',
              messages: [
                { role: 'system', content: 'Anda adalah Pakar Pendidikan Khas KPM di Malaysia. Analisis data saringan murid ini dan hasilkan Laporan Diagnostik profesional dalam Bahasa Melayu. Laporan mesti mengandungi: (1) Ulasan Tahap Kesediaan, (2) Analisis Kelemahan Spesifik Domain, (3) 3 Pelan Tindakan RPI Berfokus, dan (4) Cadangan Pedagogi Terbeza di Kelas Biasa. Tulis dalam format Markdown yang sangat kemas.' },
                { role: 'user', content: prompt }
              ],
              temperature: 0.7,
              max_tokens: 2000
            })
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.error?.message || 'Ralat API Groq: ' + res.status);
          }
          const data = await res.json();
          const laporan = data.choices?.[0]?.message?.content || 'Tiada respons daripada AI.';
          setAiModal({ murid: m, laporan, loading: false });
        } catch (e) {
          setAiModal({ murid: m, laporan: 'RALAT: ' + e.message, loading: false });

        } finally {
          setAiLoading(false);

    function SaringanPanel({ murid, onClose, onSaveScore }) {
      const [answers, setAnswers] = useState(() => {
        try { return JSON.parse(localStorage.getItem('spib_saringan_' + murid.id) || '[]'); }
        catch { return []; }
      });

      const allItems = useMemo(() => SARINGAN_ITEMS.flatMap(d => d.items.map(item => ({ domain: d.domain, item }))), []);
      const yaCount = answers.filter(a => a === 'ya').length;
      const skor = Math.round((yaCount / 25) * 100);
      const failedItems = allItems.filter((_, i) => answers[i] !== 'ya').map(x => x.item);

          kelemahan: '1. Prasarana OKU masih belum lengkap (tandas, susur taktik)\n2. Beban tugas guru PPKI yang tinggi\n3. Sumber kewangan terhad untuk alatan bantuan mengajar',
          peluang: '1. Sokongan KPM melalui SPI Bil. 1/2026\n2. Kerjasama dengan ibu bapa yang responsif\n3. Latihan dalaman perkhidmatan pedagogi terbeza & AI\n4. Bantuan NGO pendidikan khas',
          ancaman: '1. Masalah internet di bilik darjah menjejaskan akses AI\n2. Risiko murid inklusif tersisih di kelas aliran perdana\n3. Perubahan dasar pendidikan khas'
        };
      }

      useEffect(() => { localStorage.setItem('spib_prestasi', JSON.stringify(prestasi)); }, [prestasi]);
      useEffect(() => { localStorage.setItem('spib_swot', JSON.stringify(swot)); }, [swot]);

      const updateGred = (id, subj, val) => {
        setPrestasi(prev => prev.map(p => p.id === id ? { ...p, [subj]: parseInt(val) || 0 } : p));
      };
      const updateSahsiah = (id, val) => {
        setPrestasi(prev => prev.map(p => p.id === id ? { ...p, sahsiah: val } : p));
      };

      const printPrestasi = () => {
        const c = document.getElementById('print-prestasi');
        if (c) c.innerHTML = renderPrestasiHTML(prestasi);
        generatePDF('print-prestasi', 'laporan-prestasi-ppt-2026.pdf');
      };

      const printSwot = () => {
        const c = document.getElementById('print-swot');
        if (c) c.innerHTML = renderSwotHTML(swot);
        generatePDF('print-swot', 'analisis-swot-ppki-2026.pdf');
      };

      const handleSavePrasarana = async (rec) => {
        const exists = prasarana.some(p => p.id === rec.id);
        let newList;
        if (exists) {
          newList = prasarana.map(p => p.id === rec.id ? rec : p);
        } else {
          rec.id = 'P' + String(prasarana.length + 1).padStart(2, '0');
          newList = [...prasarana, rec];
        }
        setPrasarana(newList);
        localStorage.setItem('spib_prasarana', JSON.stringify(newList));
        await saveToServer('savePrasarana', rec);
        showToast('Rekod prasarana disimpan.', 'success');
        setEditPrasarana(null);
      };

      const handleDeletePrasarana = async (id) => {
        if (!confirm('Padam item prasarana ini?')) return;
        const newList = prasarana.filter(p => p.id !== id);
        setPrasarana(newList);
        localStorage.setItem('spib_prasarana', JSON.stringify(newList));
        await deleteFromServer('deletePrasarana', id);
        showToast('Item prasarana dipadam.', 'success');
      };

      return (
        <div className="space-y-6">
          {/* Rekod Prestasi PPT 2026 */}

                        <td className="px-2 py-2 font-semibold">{p.nama}</td>

                        <td className="px-2 py-2 text-center"><input type="number" value={p.mt} onChange={e => updateGred(p.id, 'mt', e.target.value)} className="w-14 bg-slate-900 border border-slate-600 rounded px-1 py-0.5 text-center text-xs" /></td>
                        <td className="px-2 py-2 text-center"><input type="number" value={p.bi} onChange={e => updateGred(p.id, 'bi', e.target.value)} className="w-14 bg-slate-900 border border-slate-600 rounded px-1 py-0.5 text-center text-xs" /></td>
                        <td className="px-2 py-2 text-center"><input type="number" value={p.sains} onChange={e => updateGred(p.id, 'sains', e.target.value)} className="w-14 bg-slate-900 border border-slate-600 rounded px-1 py-0.5 text-center text-xs" /></td>
                        <td className="px-2 py-2 text-center">
                          <select value={p.sahsiah} onChange={e => updateSahsiah(p.id, e.target.value)} className="bg-slate-900 border border-slate-600 rounded px-1 py-0.5 text-xs">
                            <option>Baik</option><option>Memuaskan</option><option>Perlu Sokongan</option>
                          </select>
                        </td>
                        <td className="px-2 py-2 text-center"><span className={'font-bold ' + (purata >= 50 ? 'text-emerald-400' : 'text-rose-400')}>{purata}</span></td>
                      </tr>

            </div>
            <div className="space-y-2">
              {prasarana.map(p => (
                <div key={p.id} className="bg-slate-900 border-2 border-slate-700 rounded-lg p-3 flex items-center justify-between flex-wrap gap-2">
                  <div>
                    <p className="font-semibold text-slate-100">{p.item}</p>
                    <p className="text-xs text-slate-400">{p.lokasi} | {p.tarikhPemantauan}</p>
                    <p className="text-xs text-slate-500">{p.catatan}</p>
                  </div>
                  <div className="flex items-center gap-2">
                    <span className={'px-2 py-1 rounded-lg text-xs font-bold ' + (p.status === 'Baik' ? 'bg-emerald-600 text-white' : p.status === 'Memuaskan' ? 'bg-amber-500 text-slate-900' : 'bg-rose-600 text-white')}>{p.status}</span>
                    <button onClick={() => setEditPrasarana(p)} className="bg-blue-600 hover:bg-blue-500 text-white p-1.5 rounded-lg border-b-2 border-blue-800 active:border-b-0 active:translate-y-0.5 transition-all">
                      <Icon name="edit-3" size={14} />
                    </button>
                    <button onClick={() => handleDeletePrasarana(p.id)} className="bg-rose-600 hover:bg-rose-500 text-white p-1.5 rounded-lg border-b-2 border-rose-800 active:border-b-0 active:translate-y-0.5 transition-all">
                      <Icon name="trash-2" size={14} />
                    </button>
                  </div>
                </div>
              ))}
            </div>
          </div>

          {/* Analisis SWOT */}
          <div className={CARD + ' p-5'}>
            <div className="flex items-center justify-between mb-4 flex-wrap gap-2">
              <h2 className="text-xl font-bold text-emerald-400 flex items-center gap-2">
                <Icon name="grid" size={22} /> Analisis SWOT Tahunan
              </h2>
              <button onClick={printSwot} className={BTN_AMBER}>
                <Icon name="printer" size={18} /> Simpan PDF SWOT
              </button>
            </div>
            <div className="grid md:grid-cols-2 gap-3">
              {[
                { key: 'kekuatan', label: 'Kekuatan (S)', color: 'emerald' },
                { key: 'kelemahan', label: 'Kelemahan (W)', color: 'rose' },
                { key: 'peluang', label: 'Peluang (O)', color: 'blue' },
                { key: 'ancaman', label: 'Ancaman (T)', color: 'amber' }

                <div key={s.key} className={'border-2 rounded-lg p-3 bg-slate-900 border-' + s.color + '-600'}>
                  <h3 className={'font-bold text-' + s.color + '-400 mb-2 text-sm'}>{s.label}</h3>
                  <textarea value={swot[s.key]} onChange={e => setSwot({ ...swot, [s.key]: e.target.value })} rows={5}

          <div id="print-swot" className="print-container" style={{ display: 'none' }}></div>
        </div>

          <td style="border:1px solid #cbd5e1;padding:5px;text-align:center;">${x.sains}</td>
          <td style="border:1px solid #cbd5e1;padding:5px;text-align:center;">${x.sahsiah}</td>
          <td style="border:1px solid #cbd5e1;padding:5px;text-align:center;font-weight:bold;">${purata}</td></tr>`;
      }).join('');
      return `<div style="font-family: Arial, sans-serif; color: #1e293b; padding: 20px; background: #fff;">
        <div style="text-align: center; margin-bottom: 16px; border-bottom: 3px double #047857; padding-bottom: 10px;">
          <h1 style="font-size: 20px; font-weight: bold; margin: 0;">SEKOLAH KEBANGSAAN SELAMA (K)</h1>
          <p style="font-size: 13px; margin: 2px 0;">Laporan Prestasi Peperiksaan Pertengahan Tahun 2026</p>
        </div>
        <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
          <thead><tr style="background: #047857; color: #fff;">
            <th style="border:1px solid #064e3b;padding:6px;text-align:left;">Nama</th>
            <th style="border:1px solid #064e3b;padding:6px;">BM</th>
            <th style="border:1px solid #064e3b;padding:6px;">MT</th>
            <th style="border:1px solid #064e3b;padding:6px;">BI</th>
            <th style="border:1px solid #064e3b;padding:6px;">Sains</th>
            <th style="border:1px solid #064e3b;padding:6px;">Sahsiah</th>
            <th style="border:1px solid #064e3b;padding:6px;">Purata</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
    }

    function renderSwotHTML(s) {
      return `<div style="font-family: Arial, sans-serif; color: #1e293b; padding: 20px; background: #fff;">
        <div style="text-align: center; margin-bottom: 16px; border-bottom: 3px double #047857; padding-bottom: 10px;">
          <h1 style="font-size: 20px; font-weight: bold; margin: 0;">SEKOLAH KEBANGSAAN SELAMA (K)</h1>
          <p style="font-size: 13px; margin: 2px 0;">Analisis SWOT Program Inklusif PPKI 2026</p>
        </div>
        <table style="width: 100%; border-collapse: collapse; font-size: 12px;">
          <tr>
            <td style="border:2px solid #047857;padding:10px;width:50%;vertical-align:top;background:#ecfdf5;"><strong style="color:#047857;">KEKUATAN (S)</strong><br><br>${(s.kekuatan||'').replace(/\n/g,'<br>')}</td>
            <td style="border:2px solid #be123c;padding:10px;width:50%;vertical-align:top;background:#fff1f2;"><strong style="color:#be123c;">KELEMAHAN (W)</strong><br><br>${(s.kelemahan||'').replace(/\n/g,'<br>')}</td>
          </tr>
          <tr>
            <td style="border:2px solid #1d4ed8;padding:10px;width:50%;vertical-align:top;background:#eff6ff;"><strong style="color:#1d4ed8;">PELUANG (O)</strong><br><br>${(s.peluang||'').replace(/\n/g,'<br>')}</td>
            <td style="border:2px solid #b45309;padding:10px;width:50%;vertical-align:top;background:#fffbeb;"><strong style="color:#b45309;">ANCAMAN (T)</strong><br><br>${(s.ancaman||'').replace(/\n/g,'<br>')}</td>
          </tr>
        </table>
      </div>`;
    }

    // ============================================================
    // KOMPONEN APLIKASI UTAMA
    // ============================================================
    function App() {
      const [tab, setTab] = useState('fail1');
      const [toast, setToast] = useState(null);
      const [refreshKey, setRefreshKey] = useState(0);
      const backend = useBackendData();

      const showToast = (msg, type = 'success') => {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      };

      useEffect(() => { refreshIcons(); }, [tab]);
      useEffect(() => {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('./sw.js').catch(() => {});
        }
      }, []);

      const tabs = [
        { id: 'fail1', label: 'Fail 1: Tadbir Urus', icon: 'landmark' },
        { id: 'fail2', label: 'Fail 2: Sumber Manusia', icon: 'users' },
        { id: 'fail3', label: 'Fail 3: Murid & AI', icon: 'brain' },
        { id: 'fail4', label: 'Fail 4: Prestasi', icon: 'bar-chart-3' }
      ];

      return (
        <div className="min-h-screen bg-slate-900">
          <header className="bg-slate-800 border-b-4 border-emerald-600 sticky top-0 z-40">
            <div className="max-w-6xl mx-auto px-4 py-3">
              <div className="flex items-center justify-between gap-3">
                <div className="flex items-center gap-3">
                  <div className="w-11 h-11 rounded-xl bg-emerald-600 flex items-center justify-center text-white font-bold text-sm border-2 border-emerald-800 shadow-md">SPIB</div>
                  <div>
                    <h1 className="text-base font-bold text-emerald-400 leading-tight">SPIB-Pintar PPKI</h1>
                    <p className="text-xs text-slate-400 leading-tight">SK Selama (K)</p>
                  </div>
                </div>
                {backend.loading && (
                  <div className="w-6 h-6 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
                )}
              </div>
            </div>
            <nav className="max-w-6xl mx-auto px-4 pb-2 flex gap-1.5 overflow-x-auto">
              {tabs.map(t => (
                <button key={t.id} onClick={() => setTab(t.id)}
                  className={'flex items-center gap-1.5 px-3 py-2 rounded-t-lg text-xs font-bold whitespace-nowrap border-b-4 transition-all ' +
                    (tab === t.id ? 'bg-emerald-600 text-white border-emerald-800' : 'bg-slate-700 text-slate-300 border-slate-700 hover:bg-slate-600')}>
                  <Icon name={t.icon} size={16} /> {t.label}
                </button>
              ))}
            </nav>
          </header>

          <main className="max-w-6xl mx-auto px-4 py-5">
            <div className="mb-5">
              <AdminSettings onSaved={() => { setRefreshKey(k => k + 1); showToast('Tetapan disimpan. Klik semula tab untuk muat semula data.', 'success'); }} />
            </div>
            <div key={tab} className="tab-active">
              {tab === 'fail1' && <Fail1 guru={backend.guru} />}
              {tab === 'fail2' && <Fail2 guru={backend.guru} />}
              {tab === 'fail3' && <Fail3 murid={backend.murid} setMurid={backend.setMurid} saveToServer={backend.saveToServer} deleteFromServer={backend.deleteFromServer} uploadFile={backend.uploadFile} showToast={showToast} />}
              {tab === 'fail4' && <Fail4 murid={backend.murid} prasarana={backend.prasarana} setPrasarana={backend.setPrasarana} saveToServer={backend.saveToServer} deleteFromServer={backend.deleteFromServer} showToast={showToast} />}
            </div>
          </main>

          <footer className="border-t-2 border-slate-700 mt-8 py-4 text-center text-xs text-slate-500">
            <p>SPIB-Pintar PPKI &copy; 2026 SK Selama (K) | Sistem Pengurusan Inklusif Bersepadu Pintar</p>
          </footer>

          <Toast {...(toast || { msg: '' })} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
  </script>
</body>
</html>
